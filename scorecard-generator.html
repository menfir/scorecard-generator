  throws('Tabel: onbekende opnamewijze wordt geweigerd',
         () => renderScoreTable({ rows: numRows(4), capture: 'stopwatch', lang: 'nl' }), /capture/);
  throws("Tabel: 'tally' noemt zichzelf als niet geïmplementeerd",
         () => renderScoreTable({ rows: numRows(4), capture: 'tally', lang: 'nl' }), /tally.*niet geïmplementeerd/);
  throws('Tabel: attemptColumns bij een formaat zonder vaste kolommen is een fout, geen stille kap',
         () => renderScoreTable({ rows: numRows(4), capture: 'tally', attemptColumns: 5, lang: 'nl' }),
         /attemptColumns/);
  throws('Tabel: vaste kolommen zonder aantal pogingen',
         () => renderScoreTable({ rows: numRows(4), capture: 'fixed-columns', lang: 'nl' }), /attemptColumns/);
  throws('Tabel: lege rijen', () => renderScoreTable({ rows: [], capture: 'fixed-columns', attemptColumns: 5 }), /rows/);
  throws('Tabel: drie zones bestaan niet',
         () => renderScoreTable({ rows: numRows(4), capture: 'fixed-columns', attemptColumns: 5, zones: 3 }), /zones/);

  // De kaarttaal staat los van de interfacetaal (§2): een Nederlandse interface
  // die Franse kaarten drukt is een ondersteunde opstelling.
  const savedUiLang = uiLang; uiLang = 'nl';
  const fr = st({ rows: numRows(4), attemptColumns: 5, lang: 'fr' }).textContent;
  uiLang = savedUiLang;
  ok('Tabel: kaarttaal fr bij interfacetaal nl geeft BLOC / ESSAI / SCORE TOTAL',
     /BLOC/.test(fr) && /ESSAI\s?1/.test(fr) && /SCORE TOTAL/.test(fr) && !/POGING/.test(fr), fr);

  // --- categorie: onbegrensde namen uit de CSV ---
  const catLang = ['u11 (meisjes/jongens)', 'u15 (meisjes)', 'u19 (jongens)'];
  eq('Categorie: gewone namen krijgen de volle maat', categoryPt(catLang, true), CAT_PT.max);
  eq('Categorie: één maat voor de hele stapel, bepaald door de langste',
     categoryPt(catLang, true), categoryPt(['u11 (meisjes/jongens)'], true));
  const langeCat = 'Jeugd u13 meisjes recreatief regio Antwerpen en omstreken, reeks B';
  ok('Categorie: een lange naam krimpt in plaats van af te kappen',
     categoryPt([langeCat], true) < CAT_PT.max);
  ok('Categorie: krimpen stopt bij de ondergrens',
     categoryPt(['X'.repeat(400)], true) === CAT_PT.min);
  ok('Categorie: de gekozen maat past ook echt in het veld', (() => {
     const c = langeCat, pt = categoryPt([c], true);
     return textWidthMm(c, 'bold ' + pt + 'pt Arial') <= catFieldMm(true) + 0.5; })());
  ok('Categorie: zonder QR is er meer plaats', catFieldMm(false) > catFieldMm(true));
  eq('Categorie: lege lijst valt niet om', categoryPt([], true), CAT_PT.max);
  ok('Categorie: de maat staat op de kaart, niet per cel',
     /--cat-pt:/.test(cardHTML(P(1, catLang[0]), Object.assign({}, ctx, { catOrder: catLang,
       mapping: { [catLang[0]]: [1,2,3,4] } }))));
  ok('Waarschuwing: een categorie die zelfs op de kleinste maat niet past',
     wHas(validate([P(1, 'X'.repeat(400))], { ['X'.repeat(400)]: [1] }, ['X'.repeat(400)]),
          'validation.warning.categoryTooLong'));
  ok('Waarschuwing: gewone categorieën geven niets',
     !wHas(validate(base, map, cats), 'validation.warning.categoryTooLong'));

  // --- tijdslotformaat (timed-spec) ---
  eq('Tijdslot: ruimte en drempel volgen uit dezelfde getallen',
     [bodyMm('abyc'), maxRowsFor('abyc'), bodyMm('timed'), maxRowsFor('timed')], [82.5, 10, 73.5, 6]);
  const tOpts = seamOptions('timed', [1,2,3,4], 'nl', 5);
  ok('Tijdslot: de instellingenlaag geeft geen pogingkolommen door', !('attemptColumns' in tOpts));
  const td = document.createElement('div'); td.innerHTML = renderScoreTable(tOpts);
  eq('Tijdslot: vijf kolommen', td.querySelectorAll('col').length, 5);
  eq('Tijdslot: turfstrook en twee registratievakjes per rij',
     td.querySelectorAll('tbody tr td.cell-tally').length + '/' + td.querySelectorAll('tbody tr td.cell-mark').length, '4/8');
  ok('Tijdslot: geen pogingkolommen voorgedrukt', !/POGING 1/.test(td.textContent));
  eq('Tijdslot: vier samenvattingsvakjes in rangschikkingsvolgorde',
     [...td.querySelectorAll('.summary .lbl')].map(e => e.textContent),
     ['TOPS', 'ZONES', 'POG. TOP', 'POG. ZONE']);
  ok('Tijdslot: de rangschikkingsregel staat als hele zin op de kaart',
     td.querySelector('.rankrule').textContent.length > 40);
  throws('Tijdslot: pogingkolommen erbij is een fout, geen stille kap',
         () => renderScoreTable(Object.assign({}, tOpts, { attemptColumns: 5 })), /attemptColumns/);
  throws('Tijdslot: negen boulders passen niet bij 12mm',
         () => renderScoreTable(seamOptions('timed', [1,2,3,4,5,6,7,8,9], 'nl', 5)), /passen niet/);
  ok('Tijdslot: zes boulders passen nog',
     typeof renderScoreTable(seamOptions('timed', [1,2,3,4,5,6], 'nl', 5)) === 'string');
  ok('Tijdslot: de controle waarschuwt voor de seam gooit',
     wHas(validate([P(1,'A')], { A:[1,2,3,4,5,6,7] }, ['A'], { format:'timed' }),
          'validation.warning.tooManyBoulders', p => p.max === 6 && p.rowHeight === 12));
  ok('Tijdslot: dezelfde indeling is bij het vaste formaat geen probleem',
     !wHas(validate([P(1,'A')], { A:[1,2,3,4,5,6,7] }, ['A'], { format:'abyc' }),
           'validation.warning.tooManyBoulders'));
  const savedUiTimed = uiLang; uiLang = 'nl';
  const tfr = document.createElement('div');
  tfr.innerHTML = renderScoreTable(seamOptions('timed', [1,2,3,4], 'fr', 5));
  uiLang = savedUiTimed;
  ok('Tijdslot: kaarttaal fr geeft ESSAIS / RÉSULTAT / ESS. TOP bij een nl interface',
     /ESSAIS/.test(tfr.textContent) && /RÉSULTAT/.test(tfr.textContent) &&
     /ESS\. TOP/.test(tfr.textContent) && !/POGINGEN/.test(tfr.textContent), tfr.textContent);

  // Het formaat wisselen raakt alleen de instellingenlaag: dezelfde kaartbouwer,
  // dezelfde aanroep, alleen andere parameters (timed-spec AC9).
  const ctxT = Object.assign({}, ctx, { format: 'timed', mapping: { A:[1,2,3,4], B:[1,2,3,4] } });
  const dt = document.createElement('div'); dt.innerHTML = buildSheets(base, ctxT);
  eq('Tijdslot: kaarten komen uit dezelfde kaartbouwer', dt.querySelectorAll('.card .score.timed').length, 3);
  ok('Tijdslot: geen pogingkolommen op de gedrukte kaart', !/POGING 1/.test(dt.textContent));
  const dagain = document.createElement('div'); dagain.innerHTML = buildSheets(base, ctx);
  eq('Tijdslot: een ABYC-kaart in dezelfde sessie blijft ongewijzigd',
     dagain.querySelector('.score tbody tr').children.length + '/' + dagain.querySelectorAll('.score.timed').length, '13/0');

  // --- papierformaat (§6.1) ---
  const ctxA5 = Object.assign({}, ctx, { paper: 'A5' });
  const d5 = document.createElement('div'); d5.innerHTML = buildSheets(base, ctxA5);
  eq('A5: 3 kaarten op 3 bladen', d5.querySelectorAll('.sheet').length, 3);
  ok('A5: elk blad krijgt de a5-klasse', [...d5.querySelectorAll('.sheet')].every(s => s.classList.contains('a5')));
  ok('A5: geen snijlijn, A4 wel', !d5.querySelector('.sheet:not(.a5)') && !!d.querySelector('.sheet.cards:not(.a5)'));
  eq('A4 blijft twee kaarten per blad', d.querySelectorAll('.sheet').length, 2);

  // --- QR-schakelaar (§7) ---
  const dq = document.createElement('div');
  dq.innerHTML = buildSheets(base, Object.assign({}, ctx, { showQr: false }));
  eq('QR uit: geen qr-element op de kaart', dq.querySelectorAll('.qr').length, 0);
  eq('QR aan: wel een qr per kaart', d.querySelectorAll('.qr').length, 3);
  eq('QR uit: kaarten blijven verder gelijk', dq.querySelectorAll('.score tbody tr').length,
     d.querySelectorAll('.score tbody tr').length);
  ok('QR uit: naamveld is breder', nameFieldMm(false) > nameFieldMm(true));
  const longName = 'Vandenbroucke-Van Nieuwenhuyse Alexander Maximiliaan';
  ok('QR uit: die extra breedte telt mee in de controle',
     validate([P(1,'A',longName)], {A:[1]}, ['A'], {showQr:true}).warnings.length >=
     validate([P(1,'A',longName)], {A:[1]}, ['A'], {showQr:false}).warnings.length);

  // --- tabel plakken (§4.2), exact de vorm die Chrome op het klembord zet ---
  const cats3 = ['u11 (meisjes/jongens)', 'u13 (jongens)', 'u13 (meisjes)'];
  const pasted = 'Route number\nColor\nJudged\nHas zone(s)\nGroups\n' +
    '1\t\nN/A\n1\nu11 (meisjes/jongens)\n' +
    '7\t\nN/A\n2\nu11 (meisjes/jongens)u13 (jongens)u13 (meisjes)\n' +
    '11\t\nN/A\n1\nu13 (jongens)u13 (meisjes)\n';
  const pt = parseBoulderTable(pasted, cats3);
  eq('Plaktabel: aaneengeplakte badges uit elkaar gehaald', pt.mapping['u13 (jongens)'], [7, 11]);
  eq('Plaktabel: boulder uit de eerste cel, niet uit de zonekolom', pt.mapping['u11 (meisjes/jongens)'], [1, 7]);
  ok('Plaktabel: cijfers in categorienamen tellen niet als boulder',
     !pt.mapping['u13 (jongens)'].includes(13) && !pt.mapping['u11 (meisjes/jongens)'].includes(11));
  eq('Plaktabel: volgorde van eerste voorkomen bewaard', pt.order, cats3);
  eq('Plaktabel: categorieën als rijen werkt ook',
     parseBoulderTable('u13 (jongens)\t7\t8\t9\nu13 (meisjes)\t7\t8\n', cats3).mapping['u13 (jongens)'], [7,8,9]);
  ok('Plaktabel: nette TSV met categorieën per boulder werkt ook',
     parseBoulderTable('3\tred\tja\t1\tu13 (jongens)\tu13 (meisjes)\n', cats3).mapping['u13 (meisjes)'][0] === 3);
  ok('Plaktabel: onherkenbare tekst geeft een fout met sleutel', (() => {
     try { parseBoulderTable('appel\tpeer\n', cats3); return false; }
     catch (e){ return e.i18n && e.i18n.key === 'error.paste.noCategories'; } })());

  // --- JSON plakken (§4.2) ---
  eq('JSON: platte vorm {categorie:[nummers]}',
     parseBoulderJSON('{"u13 (jongens)":[7,8]}', cats3).mapping['u13 (jongens)'], [7, 8]);
  eq('JSON: rij per categorie, genest in een respons',
     parseBoulderJSON('{"data":{"groups":[{"name":"u13 (jongens)","routes":[7,8,9]}]}}', cats3)
       .mapping['u13 (jongens)'], [7, 8, 9]);
  eq('JSON: rij per boulder met een lijst categorieën (etto-vorm)',
     parseBoulderJSON('[{"number":10,"groups":["u13 (jongens)","u13 (meisjes)"]},' +
                      '{"number":11,"groups":["u13 (jongens)"]}]', cats3).mapping['u13 (jongens)'], [10, 11]);
  const amb = parseBoulderJSON('[{"a":"u13 (jongens)","b":"u13 (meisjes)","n":1,"m":2}]', cats3);
  ok('JSON: onbekende vorm vraagt om veldkeuze', amb.needsMapping && amb.keys.includes('a'));
  eq('JSON: met handmatige veldkeuze alsnog verwerkt',
     parseBoulderJSON('[{"a":"u13 (jongens)","b":"x","n":1,"m":2}]', cats3, {cat:'a', num:'n'})
       .mapping['u13 (jongens)'], [1]);
  ok('JSON: ongeldige JSON gooit', (() => {
     try { parseBoulderJSON('{niet json', cats3); return false; } catch (e){ return true; } })());
  ok('JSON: dubbele nummers worden niet dubbel opgeslagen',
     parseBoulderJSON('{"u13 (jongens)":[7,7,8]}', cats3).mapping['u13 (jongens)'].length === 2);

  // --- plaktabel = raster ---
  ok('Plakken levert hetzelfde als handmatig invullen',
     JSON.stringify(parseBoulderTable('1\t\nu11 (meisjes/jongens)\n', cats3).mapping['u11 (meisjes/jongens)']) ===
     JSON.stringify([1]));

  // --- opslag (§4.4) ---
  const key = STORE + '__zelftest__';
  try {
    localStorage.setItem(key, JSON.stringify({ version:1, saved:1, settings:{title:'T'}, mapping:{'A':[1,2]} }));
    ok('Opslag: bewaarde wedstrijden worden gevonden', listSaved().some(x => x.id === '__zelftest__'));
    ok('Opslag: onbekende sleutels breken applyState niet',
       applyState({ mapping:{A:[1]}, ietsNieuws:'later', options:{paper:'A5'} }) === true);
    eq('Opslag: import van een kale indeling', (() => {
       importMapping('{"A":[3,4]}'); return S.mapping.A; })(), [3, 4]);
    eq('Opslag: import van een volledig exportbestand', (() => {
       importMapping('{"mapping":{"A":[5]},"settings":{"title":"X"}}'); return S.mapping.A; })(), [5]);
    ok('Opslag: deelnemers staan nooit in de bewaarde staat',
       !JSON.stringify(collectState()).includes('numberRaw'));
    ok('Opslag: de interfacetaal valt niet onder de wedstrijdsleutels',
       !UILANG_KEY.startsWith(STORE));
  } finally { localStorage.removeItem(key); }

  /* ======================================================================
     i18n (i18n-spec §11)
     ====================================================================== */
  const savedUi = uiLang, savedCard = cardLangSetting;

  eq('i18n: drie talen geladen', LANGS.slice().sort(), ['en','fr','nl']);
  eq('i18n: nl is de standaard en de terugval', FALLBACK, 'nl');

  // AC 8 — ontbrekende sleutel is zichtbaar fout, nooit leeg
  eq('AC8: onbekende sleutel komt tussen haken terug', t('ui.bestaat.niet'), '⟦ui.bestaat.niet⟧');
  ok('AC8: geen enkele vertaling is leeg',
     LANGS.every(l => Object.keys(LOCALES[l]).every(k => typeof LOCALES[l][k] === 'string' && LOCALES[l][k].length)));

  // §5 — terugval op nl voor een sleutel die alleen daar staat
  LOCALES.nl['ui.zelftest.alleennl'] = 'alleen in het nl-blok';
  eq('§5: onbekend in fr valt terug op nl', t('ui.zelftest.alleennl', null, 'fr'), 'alleen in het nl-blok');
  delete LOCALES.nl['ui.zelftest.alleennl'];

  // §3 — benoemde plaatshouders, in willekeurige volgorde
  eq('§3: plaatshouders worden benoemd ingevuld',
     fill('{b} voor {a}', { a: 1, b: 2 }), '2 voor 1');
  eq('§3: een onbekende plaatshouder blijft staan in plaats van "undefined"',
     fill('{a} {weg}', { a: 'x' }), 'x {weg}');
  ok('§3: elke sleutel gebruikt in elke taal dezelfde plaatshouders',
     Object.keys(LOCALES.nl).every(k =>
       LANGS.every(l => placeholders(LOCALES[l][k]) === placeholders(LOCALES.nl[k]))));

  // AC 4 — een verkeerde plaatshouder wordt gezien
  const bewaard = LOCALES.fr['validation.error.categoryZeroBoulders'];
  LOCALES.fr['validation.error.categoryZeroBoulders'] = 'La catégorie « {cat} » n’a aucun bloc.';
  ok('AC4: {category} -> {cat} in fr wordt gemeld',
     localeProblems().some(p => p.key === 'ui.diag.placeholderMismatch' &&
       p.params.lang === 'fr' && p.params.key === 'validation.error.categoryZeroBoulders'));
  LOCALES.fr['validation.error.categoryZeroBoulders'] = bewaard;

  // AC 3 — een ontbrekende sleutel wordt gemeld
  const bewaard2 = LOCALES.fr['ui.print.paper'];
  delete LOCALES.fr['ui.print.paper'];
  ok('AC3: een verwijderde franse sleutel wordt gemeld',
     localeProblems().some(p => p.key === 'ui.diag.missingKeys' && p.params.lang === 'fr' &&
       p.params.keys.includes('ui.print.paper')));
  LOCALES.fr['ui.print.paper'] = bewaard2;

  eq('Diagnose: zonder gerommel geen enkel probleem', localeProblems(), []);

  // §4 — meervoud via Intl.PluralRules, en frans rekent nul bij het enkelvoud
  eq('§4: nl 1 is enkelvoud', plural(1, 'nl'), 'one');
  eq('§4: nl 0 is meervoud',  plural(0, 'nl'), 'other');
  eq('§4: fr 0 is enkelvoud', plural(0, 'fr'), 'one');
  eq('§4: en 0 is meervoud',  plural(0, 'en'), 'other');
  ok('§4: elke meervoudssleutel heeft beide vormen in elke taal',
     Object.keys(LOCALES.nl).filter(k => k.endsWith('.one')).every(k =>
       LANGS.every(l => LOCALES[l][k] && LOCALES[l][k.slice(0, -4) + '.other'])));
  eq('§4: getallen krijgen de opmaak van de taal', nf(1234, 'nl'), (1234).toLocaleString('nl-BE'));
  ok('§4: nl-BE en en-GB verschillen in decimaalteken',
     new Intl.NumberFormat('nl-BE').format(1.5) !== new Intl.NumberFormat('en-GB').format(1.5));

  // AC 5 — nederlandse interface, franse kaarten
  uiLang = 'nl'; cardLangSetting = 'fr';
  eq('AC5: kaarttaal staat los van de interfacetaal', [cardLang(), uiLang], ['fr', 'nl']);
  const dfr = document.createElement('div');
  dfr.innerHTML = buildSheets(base, Object.assign({}, ctx, { cardLang: cardLang() }));
  const kaartTekst = dfr.querySelector('.card').textContent;
  ok('AC5: de kaart draagt de franse labels',
     ['NOM', 'DOSSARD', 'CATÉGORIE', 'BLOC'].every(w => kaartTekst.includes(w)) &&
     /ESSAI\s?1/.test(kaartTekst));
  ok('AC5: en geen nederlandse meer', !/NAAM|STARTNUMMER|POGING/.test(kaartTekst));

  // AC 7 — categorienamen blijven letterlijk, in elke taal
  const catNaam = 'u15 (meisjes)';
  ok('AC7: de categorienaam komt byte-identiek op elke kaart', LANGS.every(l => {
    const dd = document.createElement('div');
    dd.innerHTML = buildSheets([P(1, catNaam)], Object.assign({}, ctx,
      { mapping: { [catNaam]: [1,2] }, catOrder: [catNaam], cardLang: l }));
    return dd.querySelector('.cbot .val.cat').textContent === catNaam;
  }));

  // Het controleblad volgt de interfacetaal, ook met franse kaarten (§2)
  uiLang = 'en'; cardLangSetting = 'fr';
  const dctl = document.createElement('div');
  dctl.innerHTML = buildSheets(base, Object.assign({}, ctx,
    { controlSheet: true, cardLang: cardLang() }));
  ok('§2: het controleblad volgt de interface, niet de kaart',
     dctl.querySelector('.ctl .meta').textContent.includes('Control sheet'));

  // AC 6 — tekenbudgetten en de pseudotaal
  uiLang = savedUi; cardLangSetting = savedCard;
  eq('§7: elke kaartsleutel heeft een budget',
     Object.keys(LOCALES.nl).filter(k => k.startsWith('card.')).filter(k => !(k in BUDGETS)), []);
  ok('§7: geen enkele vertaling gaat over haar budget',
     LANGS.every(l => Object.keys(BUDGETS).every(k => budgetLength(LOCALES[l][k]) <= BUDGETS[k])));
  eq('§7: een plaatshouder telt als twee tekens', budgetLength('POGING {n}'), 9);
  ok('§7: de pseudotaal neemt van elke sleutel de langste vertaling',
     Object.keys(LOCALES.nl).every(k =>
       dict(PSEUDO)[k].length === Math.max(...LANGS.map(l => LOCALES[l][k].length))));
  ok('§7: de pseudotaal blijft binnen de budgetten', (() => {
     const p = dict(PSEUDO);
     return Object.keys(BUDGETS).every(k => budgetLength(p[k]) <= BUDGETS[k]); })());

  // AC 6 — 16 boulders op een kaart in de pseudotaal, minimaal 8mm rijhoogte
  const zestien = Array.from({ length: 16 }, (_, i) => i + 1);
  const dz = document.createElement('div');
  dz.innerHTML = renderScoreTable({ rows: zestien.map(b => ({ id: b, label: String(b) })),
                                   capture: 'fixed-columns', attemptColumns: 5, lang: PSEUDO });
  eq('AC6: 16 boulders geven 16 rijen', dz.querySelectorAll('tbody tr').length, 16);
  ok('AC6: 16 rijen à 8mm passen niet en dat wordt gemeld, niet stil ingekort',
     validate([P(1,'A')], { A: zestien }, ['A']).warnings
       .some(w => w.key === 'validation.warning.tooManyBoulders' && w.params.count === 16));
  ok('AC6: geen enkel kaartlabel loopt om (elk past binnen zijn budget)',
     Object.keys(BUDGETS).every(k => budgetLength(dict(PSEUDO)[k]) <= BUDGETS[k]));

  // AC 9 — van taal wisselen raakt de geladen gegevens niet aan
  ok('AC9: wisselen van taal laat deelnemers en indeling staan', (() => {
     S.participants = base.slice(); S.mapping = { A: [1,2] };
     const voor = JSON.stringify([S.participants.length, S.mapping]);
     const bewaardeTaal = uiLang;
     uiLang = 'fr'; applyStatic(); uiLang = bewaardeTaal; applyStatic();
     const na = JSON.stringify([S.participants.length, S.mapping]);
     S.participants = []; S.mapping = {};
     return voor === na; })());

  // §1 — wat níét vertaald wordt
  eq('§1: de QR-payload is taalonafhankelijk',
     LANGS.map(() => qrPayload('abyc2026-m4', 69)), LANGS.map(() => 'abyc2026-m4:69'));
  ok('§1: Z en T blijven Z en T in elke taal',
     LANGS.every(l => LOCALES[l]['card.marker.zone'] === 'Z' && LOCALES[l]['card.marker.top'] === 'T'));

  // §9 — accenten overleven het JSON-blok onder file://
  ok('§9: accenten uit het localesblok komen heel aan',
     LOCALES.fr['card.label.category'] === 'CATÉGORIE' &&
     t('ui.participants.categoryCount.other', { count: 2 }, 'nl').includes('categorieën'));

  const fails = out.filter(t2 => !t2.pass).length;
  document.body.innerHTML = '<div id="selftest"><h1>Zelftest &mdash; ' +
    (fails ? fails + ' van ' + out.length + ' GEZAKT' : out.length + ' geslaagd') + '</h1>' +
    out.map(t2 => '<div class="t ' + (t2.pass ? 'p' : 'f') + '">' + (t2.pass ? '✓' : '✗') + ' ' +
      esc(t2.name) + (t2.extra ? ' — ' + esc(t2.extra) : '') + '</div>').join('') + '</div>';
}

/* --- start --- */
applyLayoutVars(document.documentElement);
if (location.search.includes('selftest')) selfTest();
else {
  // §2: geen navigator.language — een Vlaamse organisator op een Engelse Windows
  // hoort nog altijd Nederlands te krijgen.
  const stored = (() => { try { return localStorage.getItem(UILANG_KEY); } catch (e){ return null; } })();
  if (LANGS.includes(stored)) uiLang = lastRealLang = stored;
  applyStatic();
  wire();
  renderLangSel();
  const last = listSaved()[0];        // na een herlaad of crash verdergaan (§4.4)
  if (last) loadSaved(last.id);
  refresh();
}
</script>
</body>
</html>
