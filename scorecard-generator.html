<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Scorekaarten generator</title>
<style id="pagerule">@page{size:A4 portrait;margin:0}</style>
<style>
/* ==========================================================================
   1. Scherm-UI
   ========================================================================== */
:root{
  --ink:#111; --muted:#666; --line:#d4d4d8; --bg:#f4f4f5; --panel:#fff;
  --err:#b91c1c; --warn:#a16207; --ok:#15803d;
}
*{box-sizing:border-box}
body{margin:0;font:14px/1.5 system-ui,Segoe UI,Arial,sans-serif;color:var(--ink);background:var(--bg)}
#ui{max-width:1100px;margin:0 auto;padding:24px 20px 0}
h1{font-size:22px;margin:0 0 4px}
section{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:18px 20px;margin-bottom:16px}
section > h2{font-size:15px;margin:0 0 14px;display:flex;align-items:center;gap:8px}
section > h2 .n{display:inline-flex;width:22px;height:22px;border-radius:50%;background:var(--ink);color:#fff;
  align-items:center;justify-content:center;font-size:12px;flex:none}
label{display:block;font-size:12px;color:var(--muted);margin-bottom:3px}
input[type=text],input[type=number]{width:100%;padding:7px 9px;border:1px solid var(--line);border-radius:5px;font:inherit}
.grid4{display:grid;grid-template-columns:2fr 1fr 1fr 1fr 1fr;gap:12px}
.row{display:flex;gap:16px;align-items:flex-end;flex-wrap:wrap}
button{font:inherit;padding:8px 14px;border:1px solid var(--ink);background:var(--ink);color:#fff;
  border-radius:5px;cursor:pointer}
button.sec{background:#fff;color:var(--ink)}
button:disabled{opacity:.4;cursor:not-allowed}
.hint{color:var(--muted);font-size:12px}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.tag{background:var(--bg);border:1px solid var(--line);border-radius:99px;padding:3px 10px;font-size:12px}
.msg{padding:8px 11px;border-radius:5px;font-size:13px;margin-top:10px}
.msg.err{background:#fef2f2;color:var(--err);border:1px solid #fecaca}
.msg.ok{background:#f0fdf4;color:var(--ok);border:1px solid #bbf7d0}
ul.report{list-style:none;margin:0;padding:0}
ul.report li{padding:6px 10px;border-left:3px solid;margin-bottom:5px;font-size:13px;background:var(--bg)}
li.e{border-color:var(--err);color:var(--err)}
li.w{border-color:var(--warn);color:var(--warn)}
.ackbox{display:flex;gap:8px;align-items:flex-start;margin-top:12px;font-size:13px;color:var(--ink)}
.ackbox input{margin-top:2px}

select{padding:7px 9px;border:1px solid var(--line);border-radius:5px;font:inherit;width:100%;background:#fff}
textarea{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:5px;
  font:12px/1.45 ui-monospace,Menlo,Consolas,monospace;resize:vertical}

/* tabbladen voor de drie invoermethodes */
.tabs{display:flex;gap:6px;align-items:center;border-bottom:1px solid var(--line);
  margin-bottom:14px;padding-bottom:10px;flex-wrap:wrap}
.tabs .spacer{flex:1}
button.tab{background:#fff;color:var(--muted);border:1px solid var(--line)}
button.tab.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.filelabel{font:inherit;padding:8px 14px;border:1px solid var(--ink);border-radius:5px;
  background:#fff;color:var(--ink);cursor:pointer;margin:0;font-size:14px}
#json-fields{display:flex;gap:8px;align-items:center;font-size:13px;flex-wrap:wrap}
#json-fields select{width:auto}
#saved{font-size:12px;color:var(--muted);margin-top:8px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
#saved button{padding:3px 9px;font-size:12px}

/* boulder-raster */
#gridwrap{overflow:auto;max-height:60vh;margin-top:14px;border:1px solid var(--line);border-radius:6px}
table.grid{border-collapse:collapse;font-size:12px;user-select:none}
table.grid th,table.grid td{border:1px solid var(--line);padding:0}
table.grid thead th{position:sticky;top:0;background:var(--panel);padding:8px;cursor:pointer;
  writing-mode:vertical-rl;transform:rotate(180deg);white-space:nowrap;font-weight:600}
table.grid thead th:first-child{writing-mode:horizontal-tb;transform:none;cursor:default}
table.grid td.b{width:52px;text-align:center;font-weight:700;background:var(--bg);padding:4px 0}
table.grid td.c{width:34px;height:26px;text-align:center;cursor:pointer}
table.grid td.c.on{background:var(--ink);color:#fff}
table.grid td.c.on::after{content:"\2713"}
table.grid tfoot td{background:var(--bg);text-align:center;font-size:11px;color:var(--muted);padding:4px 0}

/* afdrukvoorbeeld */
#preview{margin-top:16px;background:#e4e4e7;border-top:1px solid var(--line);
  padding:20px;max-height:80vh;overflow:auto}

/* Breed genoeg? Dan het voorbeeld naast de instellingen, met een eigen
   schuifbalk die blijft staan terwijl je links doorscrolt. Anders eronder.
   Drempel: instellingen ~640px + een blad op 50% (~400px) + marge. */
@media screen and (min-width:1180px){
  #app{display:flex;align-items:flex-start;gap:0;max-width:1700px;margin:0 auto}
  #ui{flex:1 1 auto;min-width:0;max-width:1100px;margin:0;padding-bottom:40px}
  #preview{flex:0 0 clamp(440px,42vw,700px);align-self:stretch;position:sticky;top:0;
    margin-top:0;height:100vh;max-height:100vh;border-top:0;border-left:1px solid var(--line)}
}
#print{zoom:.5}
#print:empty::before{content:var(--empty-msg);
  color:var(--muted);font-size:26px;display:block;padding:20px}

/* ==========================================================================
   2. Kaart + afdruk
   Vaste hoogtes; --body-h wordt vanuit JS gezet (één bron van waarheid met de
   controle op maximaal aantal boulders).
   ========================================================================== */
/* @page staat in een apart <style id="pagerule"> dat vanuit JS wordt gezet (§6.1). */

.sheet{width:210mm;height:297mm;position:relative;overflow:hidden;background:#fff;
  font-family:Arial,Helvetica,sans-serif;color:#000}
.sheet.a5{height:148.5mm}   /* A5 liggend: het blad is de kaart */
#print .sheet + .sheet{margin-top:14px}
/* snijlijn alleen op A4-kaartbladen: niet op het controleblad, niet op A5 */
.sheet.cards:not(.a5)::after{content:"";position:absolute;left:0;right:0;top:148.5mm;
  border-top:.3mm dashed #000}

.card{height:148.5mm;padding:var(--pad);display:flex;flex-direction:column;position:relative;overflow:hidden}

/* positiegecodeerde categoriebalk: leesbaar op een gestapelde stapel */
.band{position:absolute;left:0;width:5mm;height:14mm;background:#000;
  -webkit-print-color-adjust:exact;print-color-adjust:exact}

.chdr{height:var(--hdr-h);display:flex;gap:3mm;flex:none}
.chdr-l{flex:1;min-width:0;display:flex;flex-direction:column}
.ctitle{height:6mm;font-size:11pt;font-weight:700;line-height:6mm;white-space:nowrap;overflow:hidden}
.ctitle .sub{font-size:8pt;font-weight:400;margin-left:3mm}
.cname{height:9mm;display:flex;align-items:baseline;gap:3mm;border-bottom:.3mm solid #000;overflow:hidden}
/* Startnummer en categorie op één basislijn. Twee kolommen die elk hun eigen
   waarde onderaan uitlijnen zetten de kleinere tekst lager, omdat het grotere
   lettertype een diepere staart heeft; een raster lijnt op de basislijn uit en
   dat is wat het oog leest. */
.cbot{height:13mm;display:grid;grid-template-columns:auto 1fr;column-gap:6mm;
  align-content:end;align-items:baseline;padding-top:1mm}
.lbl{font-size:6.5pt;letter-spacing:.5pt;color:#000;font-weight:700;flex:none}
.cname .val{font-size:13pt;font-weight:700;white-space:nowrap;overflow:hidden}
.cbot .lbl{align-self:end;line-height:1.05}
.cbot .val{line-height:1;overflow:hidden}
.cbot .val.nr{font-size:26pt;font-weight:700}
.cbot .val.cat{font-size:var(--cat-pt,15pt);font-weight:700;white-space:nowrap}
.qr{flex:none;width:24mm;height:24mm;padding:2mm;background:#fff;
  -webkit-print-color-adjust:exact;print-color-adjust:exact}
.qr svg{display:block;width:20mm;height:20mm}

/* optionele kleurband (standaard uit) */
.card.colour .chdr{border-top:2mm solid var(--cat-colour);padding-top:1mm;
  -webkit-print-color-adjust:exact;print-color-adjust:exact}

.tblwrap{flex:1;display:flex;align-items:center;margin-top:var(--gap);min-height:0}
table.score{width:100%;border-collapse:collapse;table-layout:fixed}
table.score th,table.score td{border:.3mm solid #000;text-align:center;padding:0}
table.score thead tr.h1{height:6mm;line-height:1.05}
table.score thead tr.h2{height:5mm}
table.score thead th{font-size:7.5pt;font-weight:700}
table.score thead tr.h2 th{font-size:7pt}
table.score tbody tr{height:min(var(--max-row),calc(var(--body-h) / var(--rows)))}
table.score tbody td.bnum{font-size:13pt;font-weight:700}
table.score tfoot tr{height:var(--tfoot-h)}
table.score tfoot td{font-size:8.5pt;font-weight:700}
table.score tfoot td.lab{text-align:right;padding-right:3mm}

/* RCYC (platte kolommen): grijze
   scorekolommen, dikke buitenrand, dikke lijn onder de kop en links van het
   scoreblok, en een grijze voetband met witte invulvakken. */
table.score.plain{border:.6mm solid #000}
table.score.plain thead th{border-bottom-width:.6mm}
table.score.plain th.sc,table.score.plain td.sc{background:#bfbfbf;
  -webkit-print-color-adjust:exact;print-color-adjust:exact}
table.score.plain .sc0{border-left-width:.6mm}
table.score.plain tfoot td.spacer{background:#bfbfbf;border:0;
  -webkit-print-color-adjust:exact;print-color-adjust:exact}
table.score.plain tfoot td.lab{text-align:center;padding:0}

/* tijdslotformaat: turfstrook, twee registratievakjes, samenvatting */
.tbl-stack{width:100%;display:flex;flex-direction:column;gap:3mm}
table.score.timed thead tr.h1{height:9mm;line-height:1.05}
table.score.timed thead th .sub{display:flex;font-size:6pt;font-weight:400;margin-top:.5mm}
table.score.timed thead th .sub i{flex:1;font-style:normal}
table.score.timed thead th.c2 .sub i:first-child,
table.score.timed thead th.c3 .sub i:first-child{flex:0 0 10mm}
/* De turfstrook is werkruimte: lichte hulplijnen per vijf streepjes, zodat een
   telling wordt afgelezen in plaats van herteld. */
table.score.timed td.cell-tally{
  background:repeating-linear-gradient(90deg,transparent 0 9.7mm,#bbb 9.7mm 9.8mm);
  -webkit-print-color-adjust:exact;print-color-adjust:exact}
table.score.timed td.cell-mark{
  background:linear-gradient(90deg,transparent 0 9.85mm,#000 9.85mm 10.15mm,transparent 10.15mm);
  -webkit-print-color-adjust:exact;print-color-adjust:exact}
.summary{display:flex;gap:3mm}
.summary .box{flex:1;display:flex;flex-direction:column;gap:.5mm}
.summary .lbl{font-size:6.5pt;font-weight:700;letter-spacing:.5pt;text-align:center}
.summary .fld{height:12mm;border:.4mm solid #000}
.rankrule{margin:0;font-size:7pt;text-align:center}

/* controleblad */
.ctl{padding:14mm 12mm;font-family:Arial,Helvetica,sans-serif;color:#000}
.ctl h2{font-size:16pt;margin:0 0 1mm}
.ctl .meta{font-size:9pt;color:#000;margin-bottom:6mm}
.ctl table{border-collapse:collapse;font-size:8pt}
.ctl th,.ctl td{border:.3mm solid #000;padding:1mm 1.5mm;text-align:center}
.ctl th.vert{writing-mode:vertical-rl;transform:rotate(180deg);height:32mm;white-space:nowrap}
.ctl td.on{font-weight:700}
.ctl-cols{display:flex;gap:10mm;align-items:flex-start}
.ctl-cols.stacked{flex-direction:column;gap:5mm}
.sheet.a5 .ctl{padding:7mm 8mm}
.sheet.a5 .ctl h2{font-size:12pt}
.sheet.a5 .ctl .meta{margin-bottom:3mm;font-size:8pt}
.sheet.a5 .ctl table{font-size:7pt}
.sheet.a5 .ctl th,.sheet.a5 .ctl td{padding:.5mm 1mm}
.ctl .counts{font-size:9pt}
.ctl .counts td{text-align:left;padding:1.5mm 3mm;white-space:nowrap}
.ctl .counts td:nth-child(2){font-weight:700}
.ctl .counts tr:last-child td{font-weight:700}

@media screen{
  .sheet{box-shadow:0 1px 6px rgba(0,0,0,.25)}
}
@media print{
  #ui{display:none}
  #print{zoom:1}
  #preview{padding:0;border:0;max-height:none;overflow:visible;background:none;margin:0}
  #print .sheet + .sheet{margin-top:0;page-break-before:always}
  .sheet{box-shadow:none}
}

/* zelftest */
#selftest{max-width:900px;margin:0 auto;padding:30px 20px;font-family:ui-monospace,Menlo,Consolas,monospace}
#selftest .t{padding:3px 0;font-size:13px}
#selftest .t.p{color:var(--ok)}
#selftest .t.f{color:var(--err);font-weight:700}
#selftest h1{font-family:system-ui,sans-serif}

/* taalkeuze en diagnose */
.apphdr{display:flex;align-items:flex-start;justify-content:space-between;gap:16px}
.apphdr + p{margin:0 0 24px;color:var(--muted)}
.langsel{display:flex;gap:4px;flex:none}
.langsel button{padding:5px 10px;font-size:12px;font-weight:600;letter-spacing:.5px;
  background:#fff;color:var(--muted);border:1px solid var(--line)}
.langsel button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
#diag-banner:not(:empty){margin-bottom:16px}
#diag{background:var(--panel);border:1px solid var(--line);border-radius:8px;
  padding:12px 20px;margin-bottom:16px}
#diag summary{font-size:13px;color:var(--muted);cursor:pointer}
#diag[open] summary{margin-bottom:12px}
#diag-body ul.report{margin-bottom:10px}
#diag-body ul.report li{word-break:break-word}

<body>

<div id="app">
<div id="ui">
  <div class="apphdr">
    <h1 data-i18n="ui.app.title"></h1>
    <div class="langsel" id="langsel" role="group" data-i18n-aria="ui.lang.ui"></div>
  </div>
  <p data-i18n="ui.app.intro"></p>

        var b2 = read();

      var bytes = [];

        if (c < 128) {
          bytes.push(c);

<script>
"use strict";
/* ==========================================================================
   Vertalingen (i18n-spec §0, §3, §5)
   Alle teksten staan in het JSON-blok bovenaan het bestand. Hier staat alleen
   het opzoeken. Niets in deze sectie kent een enkele Nederlandse zin.
   ========================================================================== */

const BUDGETS  = LOCALES._budgets || {};

const PSEUDO   = 'zz';                                     // §7: langste vertaling, alleen om de opmaak te testen

let cardLangSetting = '';       // '' = volgt de interfacetaal

  if (lang !== PSEUDO) return LOCALES[lang] || null;
  if (!pseudoTable){
    pseudoTable = {};
    for (const k of Object.keys(LOCALES[FALLBACK]))
      pseudoTable[k] = LANGS.map(l => LOCALES[l][k])
        .filter(v => typeof v === 'string')
        .sort((a, b) => b.length - a.length)[0];
  }
  return pseudoTable;
}

  ? s.replace(/\{(\w+)\}/g, (m, k) => k in params ? String(params[k]) : m)

/* §5: taal -> nl -> de sleutel zelf tussen haken. Nooit leeg, nooit undefined. */
function t(key, params, lang){
  const l = lang || uiLang;
  const d = dict(l);
  let s = d && d[key];
  if (typeof s !== 'string' || !s) s = LOCALES[FALLBACK][key];
  if (typeof s !== 'string' || !s) return '⟦' + key + '⟧';
  return fill(s, params);

const dtf = (d, lang) => new Intl.DateTimeFormat(fmtLocale(lang),
  { dateStyle:'short', timeStyle:'short' }).format(d);

/* §4: Intl.PluralRules, niet count === 1. Frans rekent nul bij het enkelvoud. */
const plural = (count, lang) => new Intl.PluralRules(fmtLocale(lang)).select(count);
function tn(key, count, params, lang){
  const l = lang || uiLang;
  return t(key + '.' + plural(count, l), Object.assign({ count: nf(count, l) }, params), l);

const mk = s => esc(s).replace(/`([^`]+)`/g, '<code>$1</code>');

  abyc: {
    capture: 'fixed-columns', zones: 1, rowScoreColumn: true, totalsRow: true,
    usesAttempts: true, minRow: L.minRow, maxRow: L.maxRow, thead: L.thead, below: L.tfoot
  },
  // Eén vakje per poging (geen Z/T: de jury noteert per poging), aparte
  // kolommen SCORE TOP en SCORE ZONE, en twee telregels in de voet. De extra
  // voetrij telt in `below`; de kop is één regel, dus `thead` is de h1-hoogte.
  rcyc: {
    capture: 'fixed-columns', zones: 0, rowScoreColumn: true, totalsRow: true,
    itemLabel: 'card.header.route',
    scoreLabels:  ['card.header.scoreTop', 'card.header.scoreZone'],
    footerLabels: ['card.header.score', 'card.header.attempts'],
    usesAttempts: true, minRow: L.minRow, maxRow: L.maxRow, thead: 6, below: 2 * L.tfoot
  },
  timed: {
    capture: 'attempts-to', zones: 1, rowScoreColumn: true, totalsRow: true,
    usesAttempts: false, minRow: 12, maxRow: 20, thead: 9, below: 20 // een kopregel, samenvattingsblok
  }
};
const DEFAULT_FORMAT = 'abyc';
const fmtDef = f => FORMATS[f] || FORMATS[DEFAULT_FORMAT];

/* De rijen krijgen wat er over is; de rechter kolom van de controle (§5) telt met
   exact hetzelfde getal. */
function bodyMm(format){
  const f = fmtDef(format);
  return L.card - 2*L.pad - L.hdr - L.gap - f.thead - f.below;
}
function maxRowsFor(format){
  return Math.floor(bodyMm(format) / fmtDef(format).minRow);
}

/* De CSS-variabelen en de oude controle rekenen met het standaardformaat. */
L.body    = bodyMm(DEFAULT_FORMAT);        // 82.5mm
L.maxRows = maxRowsFor(DEFAULT_FORMAT);    // 10

/* Formaat -> seamparameters. Het enige wat de kaartbouwer hierover weet. */
function seamOptions(format, nums, lang, maxAttempts){
  const f = fmtDef(format);
  const o = {
    rows: nums.map(b => ({ id: b, label: String(b) })),
    capture: f.capture,
    zones: f.zones,
    rowScoreColumn: f.rowScoreColumn,
    totalsRow: f.totalsRow,
    rowHeight: { min: f.minRow, max: f.maxRow },
    bodyHeight: bodyMm(format),
    footerLabels: f.footerLabels,
    scoreLabels: f.scoreLabels,
    itemLabel: f.itemLabel,
    lang: lang
  };
  // Alleen een formaat met vaste kolommen krijgt een kolomaantal; de seam wijst
  // het bij elk ander formaat af in plaats van het stil te negeren.
  if (f.usesAttempts) o.attemptColumns = maxAttempts;
  return o;
}

/* Papierformaten. De kaart is in beide gevallen identiek (§6.1); alleen het blad
   eromheen verschilt.

   ISO A5 is 148mm hoog, een halve A4 is 148.5mm. Bij "A5 landscape" valt de kaart
   dus 0.5mm buiten de pagina en schuift elk blad een lege pagina op. Daarom een
   expliciete paginamaat gelijk aan de kaart; die halve millimeter valt op echt
   A5-papier binnen de onbedrukbare rand en daar staat niets. */
const PAPER = {
  A4: { page:'A4 portrait',      sheet:297,   perSheet:2, cut:true  },
  A5: { page:'210mm 148.5mm',    sheet:148.5, perSheet:1, cut:false }
};

/* Zonder QR schuift het naamveld 24mm op; de controle op te lange namen (§5)
   volgt die breedte, zodat er maar één getal is dat klopt. */
const nameFieldMm = showQr => showQr ? 150 : 174;

/* Categorienamen komen letterlijk uit de CSV en zijn onbegrensd: elke wedstrijd
   verzint eigen benamingen. Het veld is de kaartbreedte min de QR, min de kolom
   met het startnummer en de tussenruimte. Gerekend met het langst toegestane
   label (§7-budget), dus de maat valt eerder te klein uit dan te groot — dat is
   de veilige kant. */
const catFieldMm = showQr => showQr ? 137 : 161;

/* Eén lettergrootte voor de hele stapel, gekozen op de langste categorie, zodat
   kaarten onderling gelijk blijven. Breedte schaalt recht evenredig met de
   korpsgrootte binnen hetzelfde lettertype, dus één meting volstaat. Onder de
   ondergrens is het veld echt te klein en meldt de controle dat (§5); stil
   afkappen zou de categorie van de kaart laten verdwijnen. */
const CAT_PT = { max: 15, min: 9 };
function categoryPt(cats, showQr){
  const avail = catFieldMm(showQr);
  const wide = (cats || []).reduce(
    (w, c) => Math.max(w, textWidthMm(String(c), 'bold ' + CAT_PT.max + 'pt Arial')), 0);
  if (!wide || wide <= avail) return CAT_PT.max;
  return Math.max(CAT_PT.min, Math.floor(CAT_PT.max * avail / wide * 10) / 10);
}

function applyLayoutVars(el){
  const s = el.style;
  s.setProperty('--pad',     L.pad + 'mm');
  s.setProperty('--hdr-h',   L.hdr + 'mm');
  s.setProperty('--gap',     L.gap + 'mm');
  s.setProperty('--tfoot-h', L.tfoot + 'mm');
  s.setProperty('--body-h',  L.body + 'mm');
  s.setProperty('--max-row', L.maxRow + 'mm');
}

/* ==========================================================================
   CSV — RFC 4180: quotes, ingesloten scheidingstekens en newlines, "" -> "
   ========================================================================== */
function sniffDelimiter(text){
  const line = text.split(/\r?\n/, 1)[0] || '';
  const counts = [[';', 0], ['\t', 0], [',', 0]];
  let inQ = false;
  for (const ch of line){
    if (ch === '"') inQ = !inQ;
    else if (!inQ) for (const c of counts) if (ch === c[0]) c[1]++;
  }
  counts.sort((a,b) => b[1] - a[1]);
  return counts[0][1] > 0 ? counts[0][0] : ';';
}

function parseCSV(text, delim){
  if (text.charCodeAt(0) === 0xFEFF) text = text.slice(1);   // BOM
  delim = delim || sniffDelimiter(text);
  const rows = [];
  let row = [], field = '', i = 0, inQ = false, dirty = false;
  while (i < text.length){
    const c = text[i];
    if (inQ){
      if (c === '"'){
        if (text[i+1] === '"'){ field += '"'; i += 2; continue; }
        inQ = false; i++; continue;
      }
      field += c; i++; continue;
    }
    if (c === '"' && field === ''){ inQ = true; dirty = true; i++; continue; }
    if (c === delim){ row.push(field); field = ''; dirty = true; i++; continue; }
    if (c === '\r'){ i++; continue; }
    if (c === '\n'){
      row.push(field);
      if (dirty || row.length > 1 || row[0] !== '') rows.push(row);
      row = []; field = ''; dirty = false; i++; continue;
    }
    field += c; dirty = true; i++;
  }
  if (dirty){ row.push(field); rows.push(row); }
  return rows;
}

/* Kolommen op naam zoeken, niet op positie: de export bevat ook Ranking en
   mogelijk extra kolommen. Deze namen komen uit het platform en zijn dus geen
   UI-tekst — niet vertalen (§1). */
const COLS = {
  category: ['category', 'categorie', 'catégorie'],
  number:   ['starting number', 'startnummer', 'startnr', 'dossard'],
  name:     ['name', 'naam', 'nom']
};
function findColumns(header){
  const norm = header.map(h => String(h).trim().toLowerCase());
  const idx = {};
  for (const key in COLS) idx[key] = norm.findIndex(h => COLS[key].includes(h));
  return idx;
}

/* rows -> deelnemers. rowNo is het regelnummer zoals de gebruiker het in Excel
   ziet (1 = kopregel), zodat foutmeldingen aanwijsbaar zijn. */
function toParticipants(rows){
  if (!rows.length) throw terr('error.csv.empty');
  const idx = findColumns(rows[0]);
  const missing = Object.keys(COLS).filter(k => idx[k] < 0);
  if (missing.length)
    throw terr('error.csv.missingColumns', {
      columns: missing.map(k => COLS[k][0]).join(', '),
      header:  rows[0].join(' | ')
    });
  return rows.slice(1).map((r, i) => ({
    rowNo:    i + 2,
    category: (r[idx.category] ?? '').trim(),
    numberRaw:(r[idx.number]   ?? '').trim(),
    name:     (r[idx.name]     ?? '').trim(),
    number:   Number((r[idx.number] ?? '').trim())
  }));
}

/* ==========================================================================
   QR — payload bevat bewust geen persoonsgegevens en is taalonafhankelijk (§1).
   Komt er ooit een athleteId in de export, dan is dat hier één regel.
   ========================================================================== */
function qrPayload(competitionId, startingNumber, athleteId){
  return [competitionId, startingNumber].concat(athleteId ? [athleteId] : []).join(':');
}
function qrSvg(payload){
  const q = qrcode(0, 'M');                 // foutcorrectieniveau M
  q.addData(payload);
  q.make();
  return q.createSvgTag({ cellSize:1, margin:0, scalable:true });
}

/* ==========================================================================
   Validatie — alle controles draaien altijd, het rapport toont alles tegelijk.
   Meldingen komen er als {key, params} uit, niet als zin: de taal wordt pas bij
   het tekenen gekozen, zodat wisselen van taal het rapport meteen meeneemt.
   ========================================================================== */
function textWidthMm(text, font){
  const c = textWidthMm._c || (textWidthMm._c = document.createElement('canvas').getContext('2d'));
  c.font = font;
  return c.measureText(text).width / MM;
}

function validate(participants, mapping, catOrder, opts){
  const errors = [], warnings = [];
  const err  = (key, params) => errors.push({ key, params });
  const warn = (key, params) => warnings.push({ key, params });
  const seen = new Map();
  const nameMax = nameFieldMm(!opts || opts.showQr !== false);

  participants.forEach(p => {
    if (!p.name)      err('validation.error.nameEmpty',     { row: p.rowNo });
    if (!p.category)  err('validation.error.categoryEmpty', { row: p.rowNo });
    if (!p.numberRaw) err('validation.error.numberEmpty',   { row: p.rowNo });
    else if (!/^\d+$/.test(p.numberRaw) || p.number < 1)
      err('validation.error.numberNotPositive', { row: p.rowNo, value: p.numberRaw });
    else if (seen.has(p.number))
      err('validation.error.duplicateStartNumber', {
        number: p.number,
        rowA: seen.get(p.number).rowNo, nameA: seen.get(p.number).name,
        rowB: p.rowNo,                  nameB: p.name });
    else seen.set(p.number, p);

    if (p.name && textWidthMm(p.name, 'bold 13pt Arial') > nameMax)
      warn('validation.warning.nameTooLong', { row: p.rowNo, name: p.name });
  });

  const csvCats = new Set(participants.map(p => p.category).filter(Boolean));
  const mapCats = catOrder.filter(c => mapping[c]);

  const catMax = catFieldMm(!opts || opts.showQr !== false);
  csvCats.forEach(c => {
    if (!mapping[c]) err('validation.error.categoryMissingInMapping', { category: c });
    // Onder de kleinste maat past de categorie niet meer; melden in plaats van
    // hem stil van de kaart te knippen.
    if (textWidthMm(c, 'bold ' + CAT_PT.min + 'pt Arial') > catMax)
      warn('validation.warning.categoryTooLong', { category: c });
  });
  mapCats.forEach(c => {
    if (!csvCats.has(c)) err('validation.error.categoryWithoutParticipants', { category: c });
    const nums = mapping[c];
    if (!nums.length) err('validation.error.categoryZeroBoulders', { category: c });
    const dup = nums.filter((n, i) => nums.indexOf(n) !== i);
    [...new Set(dup)].forEach(n =>
      err('validation.error.duplicateBoulder', { number: n, category: c }));
  });

  const live = mapCats.filter(c => csvCats.has(c));
  if (new Set(live.map(c => mapping[c].length)).size > 1)
    warn('validation.warning.differingBoulderCounts', {
      summary: live.map(c => c + ': ' + mapping[c].length).join(', ') });
  // Drempel en rijhoogte komen uit het formaat, niet uit een tweede vast getal:
  // een tijdslotkaart heeft bredere rijen en dus minder plaats (timed-spec §5).
  const format = (opts && opts.format) || DEFAULT_FORMAT;
  const maxRows = maxRowsFor(format), minRow = fmtDef(format).minRow;
  mapCats.forEach(c => {
    if (mapping[c].length > maxRows)
      warn('validation.warning.tooManyBoulders', {
        category: c, count: mapping[c].length, max: maxRows, rowHeight: minRow });
  });

  return { errors, warnings };
}

/* ==========================================================================
   Sortering — categorie (volgorde uit de boulderindeling), dan startnummer.
   Sorteren gebeurt met de interfacetaal, want het is de volgorde waarin de
   organisator de stapel krijgt.
   ========================================================================== */
function sortCards(participants, catOrder){
  const rank = new Map(catOrder.map((c, i) => [c, i]));
  return participants.slice().sort((a, b) => {
    const ra = rank.has(a.category) ? rank.get(a.category) : 1e9;
    const rb = rank.has(b.category) ? rank.get(b.category) : 1e9;
    if (ra !== rb) return ra - rb;
    if (a.category !== b.category) return a.category < b.category ? -1 : 1;
    return a.number - b.number;
  });
}

/* ==========================================================================
   Boulderindeling plakken (§4.2 methode 1 en 2)

   Beide parsers leveren hetzelfde op als het handmatige raster:
   { mapping: {categorie: [nummers]}, order: [categorie...] }.
   De categorieën uit de deelnemerslijst zijn het anker — zonder CSV kan er niets
   herkend worden. Categorienamen worden nooit vertaald of genormaliseerd (§1).
   ========================================================================== */
function emptyResult(knownCats){
  const mapping = {};
  knownCats.forEach(c => mapping[c] = []);
  return { mapping, order: [] };
}
function addBoulder(res, cat, n){
  if (!res.mapping[cat]) { res.mapping[cat] = []; }
  if (!res.order.includes(cat)) res.order.push(cat);
  if (!res.mapping[cat].includes(n)) res.mapping[cat].push(n);
}

/* Categorienamen als deeltekst zoeken, langste eerst, en elke treffer
   dichtmetselen. Nodig omdat de badges aan elkaar geplakt worden en omdat
   categorienamen zelf cijfers bevatten (u11, u13) die anders als boulder tellen. */
function extractCats(text, knownCats){
  let rest = text;
  const found = [];
  for (const c of knownCats.slice().sort((a, b) => b.length - a.length)){
    let i;
    while (c && (i = rest.indexOf(c)) >= 0){
      found.push(c);
      rest = rest.slice(0, i) + ' '.repeat(c.length) + rest.slice(i + c.length);
    }
  }
  return { cats: [...new Set(found)], rest };
}

/* Chrome plakt deze tabel niet als nette TSV: één tab per rij, de overige cellen
   op eigen regels. Een nieuwe rij begint dus bij elke regel mét tab. Dezelfde
   regel werkt ook voor echte TSV, waar elke regel tabs heeft. */
function splitRecords(text){
  const records = [];
  for (const line of text.split(/\r?\n/)){
    if (!line.trim()) continue;
    if (line.includes('\t') || !records.length) records.push(line);
    else records[records.length - 1] += '\n' + line;
  }
  return records;
}

function parseBoulderTable(text, knownCats){
  const res = emptyResult(knownCats);
  let matched = 0;
  for (const rec of splitRecords(text)){
    const { cats, rest } = extractCats(rec, knownCats);
    const first = rec.split('\t')[0].split('\n')[0].trim();
    if (/^\d+$/.test(first)){                       // boulders als rijen
      cats.forEach(c => addBoulder(res, c, Number(first)));
      if (cats.length) matched++;
    } else if (knownCats.includes(first)){          // categorieën als rijen
      (rest.match(/\d+/g) || []).forEach(n => addBoulder(res, first, Number(n)));
      matched++;
    }
  }
  if (!matched) throw terr('error.paste.noCategories', { names: knownCats.join(', ') });
  res.info = { key: 'ui.paste.rowsMatched', count: matched };
  return res;
}

/* ---- JSON (§4.2 methode 1) ---- */
function findObjectArrays(data, depth, out){
  out = out || []; depth = depth || 0;
  if (depth > 5 || !data || typeof data !== 'object') return out;
  if (Array.isArray(data)){
    if (data.length && data.every(x => x && typeof x === 'object' && !Array.isArray(x))) out.push(data);
    return out;
  }
  for (const k in data) findObjectArrays(data[k], depth + 1, out);
  return out;
}
const asArray = v => Array.isArray(v) ? v : [v];
const isNumish = v => typeof v === 'number' || (typeof v === 'string' && /^\d+$/.test(v.trim()));

function detectFields(rows, keys, knownCats){
  const catKeys = keys.filter(k => rows.some(r =>
    asArray(r[k]).some(v => typeof v === 'string' && knownCats.includes(v.trim()))));
  const numKeys = keys.filter(k => !catKeys.includes(k) && rows.some(r =>
    asArray(r[k]).length && asArray(r[k]).every(isNumish)));
  return (catKeys.length === 1 && numKeys.length === 1) ? { cat: catKeys[0], num: numKeys[0] } : null;
}

/* Eén reductie voor beide oriëntaties: het kruisproduct van de categorieën en de
   nummers in een rij. Rij = één categorie met veel boulders, óf één boulder met
   veel categorieën — beide komen hier goed uit. */
function reduceRows(rows, fm, knownCats){
  const res = emptyResult(knownCats);
  for (const r of rows){
    const cats = asArray(r[fm.cat]).filter(v => typeof v === 'string').map(v => v.trim());
    const nums = asArray(r[fm.num]).filter(isNumish).map(Number);
    for (const c of cats) for (const n of nums) addBoulder(res, c, n);
  }
  return res;
}

function parseBoulderJSON(text, knownCats, fieldMap){
  const data = JSON.parse(text);
  // Vorm 1: { "u11 (meisjes/jongens)": [1,2,3] }
  if (data && !Array.isArray(data) && typeof data === 'object'){
    const keys = Object.keys(data);
    if (keys.length && keys.every(k => Array.isArray(data[k]) && data[k].every(isNumish))){
      const res = emptyResult(knownCats);
      keys.forEach(k => data[k].forEach(n => addBoulder(res, k.trim(), Number(n))));
      res.info = { key: 'ui.paste.categoriesRead', count: keys.length };
      return res;
    }
  }
  // Vorm 2: ergens in de JSON een lijst met objecten
  const arrays = findObjectArrays(data).sort((a, b) => b.length - a.length);
  if (!arrays.length) throw terr('error.json.noObjectArray');
  const rows = arrays[0];
  const keys = [...new Set(rows.flatMap(r => Object.keys(r)))];
  const fm = fieldMap || detectFields(rows, keys, knownCats);
  if (!fm) return { needsMapping: true, keys, rows: rows.length, sample: rows[0] };
  const res = reduceRows(rows, fm, knownCats);
  if (!res.order.length) throw terr('error.json.noKnownCategory');
  res.info = { key: 'ui.paste.rowsRead', count: rows.length,
               params: { catField: fm.cat, numField: fm.num } };
  res.fieldMap = fm;
  return res;
}

/* ==========================================================================
   Kaart — labels volgen de kaarttaal (§2), niet de interfacetaal.
   ========================================================================== */
/* De enige plek die weet hoe een scoretabel eruitziet (§12.2). Rendert voor een
   CATEGORIE, niet voor een deelnemer: geen naam, geen startnummer, geen QR.

   Een optieobject, geen losse argumenten, zodat een nieuw wedstrijdformaat hier
   een tak bijzet en verder niets aanraakt. `capture`, `attemptColumns` en
   `zones` beschrijven de tabel volledig; een formaatnaam erbovenop zou een
   tweede waarheid zijn die met die drie in tegenspraak kan komen. */
const CAPTURE_MODES = ['fixed-columns', 'tally', 'attempts-to', 'none'];

function renderScoreTable(opts){
  // defaults eerst, dan pas controleren: anders klaagt de controle over een
  // weggelaten parameter in plaats van over het echte probleem.
  const cfg = Object.assign({
    zones: 1, rowScoreColumn: true, totalsRow: true, attemptColumns: 0
  }, opts);
  // Een formaat mag de voet weglaten (undefined in FORMATS), niet leegmaken:
  // een lege lijst met totalsRow aan zou een voet zonder regels betekenen.
  if (!cfg.footerLabels) cfg.footerLabels = ['card.footer.total'];
  if (!Array.isArray(cfg.footerLabels) || !cfg.footerLabels.length)
    throw new Error('renderScoreTable: footerLabels moet een niet-lege array met tekstsleutels zijn');

  if (!Array.isArray(cfg.rows) || !cfg.rows.length)
    throw new Error('renderScoreTable: rows moet een niet-lege array zijn');
  if (!CAPTURE_MODES.includes(cfg.capture))
    throw new Error('renderScoreTable: capture moet een van ' + CAPTURE_MODES.join(', ') + ' zijn');
  // Een vaste-kolomraster met een onbeperkt-pogingenformaat kapt stil het aantal
  // pogingen af: de kaart oogt goed en het resultaat is fout. Nooit een waarschuwing.
  if (cfg.capture === 'fixed-columns'){
    if (!Number.isInteger(cfg.attemptColumns) || cfg.attemptColumns < 1)
      throw new Error("renderScoreTable: capture 'fixed-columns' vereist attemptColumns >= 1");
  } else if (cfg.attemptColumns){
    throw new Error("renderScoreTable: attemptColumns heeft geen betekenis bij capture '" + cfg.capture + "'");
  }
  if (![0, 1, 2].includes(cfg.zones))
    throw new Error('renderScoreTable: zones moet 0, 1 of 2 zijn');

  switch (cfg.capture){
    case 'fixed-columns': return cfg.scoreLabels ? plainColumnsTable(cfg) : fixedColumnsTable(cfg);
    case 'attempts-to':   return attemptsToTable(cfg);
    default:
      throw new Error("renderScoreTable: capture '" + cfg.capture + "' is niet geïmplementeerd");
  }
}

/* RCYC-variant van het vaste raster: geen Z/T-onderverdeling, dus één kopregel
   en één vakje per poging; de score staat in eigen kolommen (`scoreLabels`).
   Bewust een eigen bouwer: de twee tabellen delen alleen de rijhoogtesom, en
   vlaggen door fixedColumnsTable rijgen maakt beide onleesbaar. */
function plainColumnsTable(cfg){
  const { rows, attemptColumns: n, scoreLabels, footerLabels, totalsRow, lang } = cfg;
  const cells = n + scoreLabels.length;
  // .sc = grijze scorekolom, .sc0 = dikke lijn waar het scoreblok begint
  const scCls = i => 'sc' + (i ? '' : ' sc0');

  const h1 = '<tr class="h1"><th>' + et(cfg.itemLabel || 'card.header.boulder', null, lang) + '</th>' +
    Array.from({ length: n }, (_, i) => '<th>' + et('card.header.attempt', { n: i + 1 }, lang) + '</th>').join('') +
    scoreLabels.map((k, i) => '<th class="' + scCls(i) + '">' + et(k, null, lang) + '</th>').join('') + '</tr>';

  const blanks = '<td></td>'.repeat(n) +
    scoreLabels.map((_, i) => '<td class="' + scCls(i) + '"></td>').join('');
  const body = rows.map(r => '<tr><td class="bnum">' + esc(r.label) + '</td>' + blanks + '</tr>').join('');
  // Voet als in het sjabloon: grijze band, wit labelvak in de laatste
  // pogingkolom, grijze invulvakken onder de scorekolommen.
  const footCells = scoreLabels.map((_, i) => '<td class="' + scCls(i) + '"></td>').join('');
  const foot = totalsRow
    ? '<tfoot>' + footerLabels.map(k => '<tr><td class="spacer" colspan="' + n + '"></td>' +
      '<td class="lab">' + et(k, null, lang) + '</td>' + footCells + '</tr>').join('') + '</tfoot>'
    : '';

  const budget = cfg.bodyHeight || L.body;
  const maxRow = (cfg.rowHeight && cfg.rowHeight.max) || L.maxRow;
  return '<table class="score plain" style="--body-h:' + budget.toFixed(1) + 'mm;' +
         '--max-row:' + maxRow + 'mm"><colgroup><col style="width:20mm">' +
         '<col span="' + cells + '"></colgroup><thead>' + h1 + '</thead><tbody>' +
         body + '</tbody>' + foot + '</table>';
}

function fixedColumnsTable(cfg){
  const { rows, attemptColumns: n, zones, rowScoreColumn, totalsRow, footerLabels, lang } = cfg;
  const z = et('card.marker.zone', null, lang), tp = et('card.marker.top', null, lang);
  // 0 zones -> [T], 1 -> [Z,T], 2 -> [Z1,Z2,T]
  const markers = zones === 0 ? [tp] : zones === 1 ? [z, tp] : [z + '1', z + '2', tp];
  const per = markers.length;
  const scoreCols = rowScoreColumn ? per : 0;
  const cells = n * per + scoreCols;

  let h1 = '<tr class="h1"><th rowspan="2">' + et('card.header.boulder', null, lang) + '</th>';
  let h2 = '<tr class="h2">';
  const group = markers.map(m => '<th>' + m + '</th>').join('');
  // Het nummer altijd op een eigen regel: verticaal is er ruimte over, horizontaal
  // niet. Anders breekt "POGING 10" wel en "POGING 9" niet, en plakken de korte
  // koppen tegen de celrand. Breekt op de laatste spatie, dus in elke taal.
  const attempt = i => et('card.header.attempt', { n: i }, lang).replace(/\s(?=\S*$)/, '<br>');
  for (let i = 1; i <= n; i++){
    h1 += '<th colspan="' + per + '">' + attempt(i) + '</th>';
    h2 += group;
  }
  if (rowScoreColumn){
    h1 += '<th colspan="' + per + '">' + et('card.header.score', null, lang) + '</th>';
    h2 += group;
  }
  h1 += '</tr>'; h2 += '</tr>';

  const blanks = '<td></td>'.repeat(cells);
  const body = rows.map(r => '<tr><td class="bnum">' + esc(r.label) + '</td>' + blanks + '</tr>').join('');
  const foot = totalsRow
    ? '<tfoot>' + footerLabels.map(k => '<tr><td class="lab" colspan="' + (1 + n * per) + '">' +
      et(k, null, lang) + '</td>' + '<td></td>'.repeat(scoreCols) + '</tr>').join('') + '</tfoot>'
    : '';

  // De rijhoogte rekent met de ruimte die dit formaat overhoudt, niet met de
  // globale ABYC-waarde: een formaat met een extra voetregel houdt minder over
  // en liet de tabel anders onder de kaart uit lopen.
  const budget = cfg.bodyHeight || L.body;
  const maxRow = (cfg.rowHeight && cfg.rowHeight.max) || L.maxRow;

  return '<table class="score" style="--body-h:' + budget.toFixed(1) + 'mm;' +
         '--max-row:' + maxRow + 'mm"><colgroup><col style="width:20mm">' +
         '<col span="' + cells + '"></colgroup><thead>' + h1 + h2 + '</thead><tbody>' +
         body + '</tbody>' + foot + '</table>';
}

/* --------------------------------------------------------------------------
   Tijdslot met onbeperkte pogingen (timed-spec). Geen pogingkolommen: die zouden
   het aantal pogingen stil aftoppen, en dat is precies wat dit formaat niet doet.
   De jury turft in een brede werkstrook en schrijft twee getallen op.

   De kolombreedtes staan hier omdat ze de kolomindeling zijn, niet de opmaak;
   alles wat kleur, lijndikte of lettergrootte is, zit in de CSS.
   -------------------------------------------------------------------------- */
const TIMED_COLS = [18, 80, 26, 26, 40];   // BOULDER | POGINGEN | ZONE | TOP | RESULTAAT

function attemptsToTable(cfg){
  const { rows, rowScoreColumn, totalsRow, lang } = cfg;
  const rh = cfg.rowHeight || { min: FORMATS.timed.minRow, max: FORMATS.timed.maxRow };
  const budget = cfg.bodyHeight || bodyMm('timed');

  // De jury schrijft in deze rijen, dus onder de minimumhoogte is de kaart
  // onbruikbaar in plaats van krap. Hier hard weigeren (timed-spec §5); de
  // controle (§5 basisspec) hoort dit al gemeld te hebben.
  if (rows.length * rh.min > budget){
    throw new Error('renderScoreTable: ' + rows.length + ' rijen passen niet bij ' + rh.min +
      'mm (ruimte ' + budget.toFixed(1) + 'mm). De controle had dit moeten tegenhouden.');
  }

  const cols = rowScoreColumn ? TIMED_COLS : TIMED_COLS.slice(0, 4);
  const head = [
    et('card.header.boulder', null, lang),
    et('card.header.attempts', null, lang),
    // De turfstrook is werkruimte; deze twee vakjes zijn de registratie. Het
    // vinkje haalt de dubbelzinnigheid weg tussen "niet gehaald" en "vergeten".
    et('card.header.zone', null, lang) + '<span class="sub"><i>&#10003;</i><i>#</i></span>',
    et('card.header.top', null, lang) + '<span class="sub"><i>&#10003;</i><i>#</i></span>',
    et('card.header.result', null, lang)
  ].slice(0, cols.length);

  // De scheiding tussen vinkvakje en getalvakje is een achtergrondlijn, geen
  // extra element: een percentagehoogte binnen een td is niet betrouwbaar.
  const cell = '<td class="cell-tally"></td>' +
    '<td class="cell-mark"></td>'.repeat(2) +
    (rowScoreColumn ? '<td class="cell-result"></td>' : '');
  const body = rows.map(r =>
    '<tr><td class="bnum">' + esc(r.label) + '</td>' + cell + '</tr>').join('');

  const table = '<table class="score timed" style="--body-h:' + budget.toFixed(1) + 'mm;' +
      '--max-row:' + rh.max + 'mm"><colgroup>' +
      cols.map(w => '<col style="width:' + w + 'mm">').join('') + '</colgroup><thead><tr class="h1">' +
      head.map((h, i) => '<th class="c' + i + '">' + h + '</th>').join('') +
      '</tr></thead><tbody>' + body + '</tbody></table>';

  // De samenvatting hoort bij de kaart, niet bij een tabelrij: vier losse
  // velden die nergens in het lichaam een kolom hebben. Vorm van het formaat,
  // dus hier afgeleid en geen parameter (timed-spec §6.1).
  const summary = totalsRow ? '<div class="summary">' +
    ['card.summary.tops', 'card.summary.zones',
     'card.summary.topAttempts', 'card.summary.zoneAttempts'].map(k =>
      '<div class="box"><span class="lbl">' + et(k, null, lang) + '</span><span class="fld"></span></div>'
    ).join('') + '</div>' +
    '<p class="rankrule">' + et('card.footer.rankingRule', null, lang) + '</p>' : '';

  // Als een string terug, zodat de kaartbouwer formaatonwetend blijft.
  return '<div class="tbl-stack">' + table + summary + '</div>';
}

function cardHTML(p, ctx){
  const lang = ctx.cardLang;
  const nums = (ctx.mapping[p.category] || []).slice().sort((a, b) => a - b);
  const i = ctx.catOrder.indexOf(p.category);
  const span = L.card - 2 * L.pad - 14;
  const top = L.pad + (ctx.catOrder.length > 1 ? i * span / (ctx.catOrder.length - 1) : span / 2);
  const colour = ctx.colour ? ';--cat-colour:hsl(' + Math.round(360 * i / Math.max(1, ctx.catOrder.length)) + ' 70% 45%)' : '';

  // Dezelfde maat op elke kaart van de stapel: hij hangt aan de categorielijst
  // van de wedstrijd, niet aan de deelnemer op deze kaart.
  const catPt = categoryPt(ctx.catOrder, ctx.showQr !== false);

  return '<div class="card' + (ctx.colour ? ' colour' : '') + '" style="--rows:' + nums.length +
    ';--cat-pt:' + catPt + 'pt' + colour + '">' +
    '<div class="band" style="top:' + top.toFixed(1) + 'mm"></div>' +
    '<div class="chdr"><div class="chdr-l">' +
      // titel en ondertitel zijn ingetypte eigennamen: nooit vertalen (§1)
      '<div class="ctitle">' + esc(ctx.title) + (ctx.subtitle ? '<span class="sub">' + esc(ctx.subtitle) + '</span>' : '') + '</div>' +
      '<div class="cname"><span class="lbl">' + et('card.label.name', null, lang) + '</span>' +
        '<span class="val">' + esc(p.name) + '</span></div>' +
      '<div class="cbot">' +
        // Labels op de eerste rasterregel, waarden op de tweede: zo lijnen 80 en
        // "u11 (meisjes/jongens)" op dezelfde basislijn uit.
        '<span class="lbl nr">' + et('card.label.startNumber', null, lang) + '</span>' +
        // categorie komt letterlijk uit de CSV en blijft in elke taal identiek (§1)
        '<span class="lbl cat">' + et('card.label.category', null, lang) + '</span>' +
        '<span class="val nr">' + p.number + '</span>' +
        '<span class="val cat">' + esc(p.category) + '</span>' +
      '</div>' +
    '</div>' +
    (ctx.showQr ? '<div class="qr">' + qrSvg(qrPayload(ctx.competitionId, p.number)) + '</div>' : '') +
    '</div>' +
    // Alles hier is een wedstrijdinstelling of een constante van het formaat;
    // niets komt uit de deelnemer. Een ander formaat wijzigt deze waarden (§12.2).
    // De kaartbouwer weet niet welk formaat gedrukt wordt: seamOptions vertaalt
    // de instelling naar parameters (§12.2). Een derde formaat raakt deze regel niet.
    '<div class="tblwrap">' +
      renderScoreTable(seamOptions(ctx.format, nums, lang, ctx.maxAttempts)) + '</div>' +
  '</div>';
}

/* Matrix in één richting opbouwen; A4 en A5 verschillen alleen in wie de rijen
   levert en wie de kolommen (§6.6). */
function matrixHTML(rowKeys, colKeys, vertHeads, hit){
  const head = '<tr><th></th>' + colKeys.map(c =>
    '<th' + (vertHeads ? ' class="vert"' : '') + '>' + esc(c) + '</th>').join('') + '</tr>';
  const body = rowKeys.map(r => '<tr><td><b>' + esc(r) + '</b></td>' +
    colKeys.map(c => hit(r, c) ? '<td class="on">&#9679;</td>' : '<td></td>').join('') + '</tr>').join('');
  return '<table><thead>' + head + '</thead><tbody>' + body + '</tbody></table>';
}

/* Het controleblad is een document voor de organisator en volgt dus de
   interfacetaal, ook als de kaarten in een andere taal gedrukt worden (§2). */
function controlSheetHTML(ctx, participants){
  const cats = ctx.catOrder;
  const all = [...new Set(cats.flatMap(c => ctx.mapping[c]))].sort((a, b) => a - b);
  const has = (b, c) => ctx.mapping[c].includes(Number(b));
  const matrix = ctx.paper === 'A5'
    ? matrixHTML(cats, all, false, (c, b) => has(b, c))   // liggend: categorieën als rijen
    : matrixHTML(all, cats, true,  (b, c) => has(b, c));  // staand: boulders als rijen
  const counts = cats.map(c => '<tr><td>' + esc(c) + '</td><td>' +
    esc(tn('control.participants', participants.filter(p => p.category === c).length)) + '</td><td>' +
    esc(tn('control.boulders', ctx.mapping[c].length)) + '</td></tr>').join('');

  // ponytail: A4 zet matrix en aantallen naast elkaar (past tot ~50 boulders),
  // A5 zet ze onder elkaar (past tot ~30). Daarboven loopt de matrix van het blad.
  return '<div class="sheet' + (ctx.paper === 'A5' ? ' a5' : '') + '"><div class="ctl">' +
    '<h2>' + esc(ctx.title) + (ctx.subtitle ? ' &ndash; ' + esc(ctx.subtitle) : '') + '</h2>' +
    '<div class="meta">' + et('control.meta', { id: ctx.competitionId, datetime: dtf(new Date()) }) + '</div>' +
    '<div class="ctl-cols' + (ctx.paper === 'A5' ? ' stacked' : '') + '">' + matrix +
      '<table class="counts"><tbody>' + counts +
        '<tr><td>' + et('control.total') + '</td><td>' +
        esc(tn('control.participants', participants.length)) + '</td><td>' +
        esc(tn('control.bouldersInGym', all.length)) + '</td></tr></tbody></table>' +
    '</div></div></div>';
}

function buildSheets(participants, ctx){
  const paper = PAPER[ctx.paper] || PAPER.A4;
  const cards = sortCards(participants, ctx.catOrder).map(p => cardHTML(p, ctx));
  let html = ctx.controlSheet ? controlSheetHTML(ctx, participants) : '';
  for (let i = 0; i < cards.length; i += paper.perSheet){
    const on = cards.slice(i, i + paper.perSheet).join('');
    html += '<div class="sheet cards' + (paper.cut ? '' : ' a5') + '">' + on + '</div>';
  }
  return html;
}

/* @page kent geen custom properties, dus de regel wordt hier verwisseld (§6.1). */
function applyPaper(paper){
  const p = PAPER[paper] || PAPER.A4;
  $('pagerule').textContent = '@page{size:' + p.page + ';margin:0}';
  $('print').classList.toggle('a5', paper === 'A5');
}

/* ==========================================================================
   App-state en UI
   ========================================================================== */
const $ = id => document.getElementById(id);
const S = {
  participants: [],      // alleen in geheugen, nooit naar localStorage
  loadError: null,       // Error met i18n-sleutel
  mapping: {},           // categorie -> [boulders]
  catOrder: null,        // volgorde uit een geplakte indeling; null = alfabetisch
  gridMax: 30,
  ack: false,
  tab: 'grid',
  pasteMsg: null,        // {type, parts:[{key,count,params}]} onder het actieve tabblad
  jsonKeys: null         // veldkeuze tonen als de JSON-vorm onbekend is
};

/* Eén zin uit een {key, count, params}-blokje. Zonder count geen meervoud. */
const say = p => p.raw !== undefined ? p.raw
  : (p.count === undefined ? t(p.key, p.params) : tn(p.key, p.count, p.params));

/* Categorieën uit de CSV, gesorteerd met de interfacetaal. De namen zelf blijven
   letterlijk wat het platform leverde (§1) — alleen de volgorde is taalgevoelig. */
function categories(){
  return [...new Set(S.participants.map(p => p.category).filter(Boolean))]
    .sort((a, b) => a.localeCompare(b, fmtLocale()));
}
/* Kaartvolgorde (§6.3): volgorde uit de geplakte indeling als die er is, anders
   alfabetisch. Alleen categorieën die ook echt deelnemers hebben. */
function orderedCategories(){
  // Ook categorieën die alleen in de indeling zitten: die horen een harde fout
  // op te leveren (§5) en mogen dus niet stilletjes wegvallen.
  const all = [...new Set(categories().concat(Object.keys(S.mapping)))];
  const alpha = (a, b) => a.localeCompare(b, fmtLocale());
  if (!S.catOrder) return all.sort(alpha);
  const known = S.catOrder.filter(c => all.includes(c));
  return known.concat(all.filter(c => !known.includes(c)).sort(alpha));
}
function settings(){
  const id = $('f-id').value.trim();
  return {
    // Geen vertaalde standaardwaarde: een lege titel valt terug op het ID, want
    // de titel is ingetypte tekst en hoort in geen enkele taal thuis (§1).
    title: $('f-title').value.trim() || id || '—',
    subtitle: $('f-sub').value.trim(),
    competitionId: id || 'comp',
    maxAttempts: Math.max(1, Math.min(12, Number($('f-att').value) || 5)),
    format: FORMATS[$('f-format').value] ? $('f-format').value : DEFAULT_FORMAT,
    cardLanguage: cardLangSetting
  };
}
function options(){
  return {
    paper: $('o-paper').value === 'A5' ? 'A5' : 'A4',
    showQr: $('o-qr').checked,
    controlSheet: $('o-ctl').checked,
    colour: $('o-colour').checked
  };
}

/* ==========================================================================
   Opslag (§4.4) — instellingen en indeling per competitionId. Deelnemers nooit.
   De interfacetaal staat los opgeslagen: die hoort bij de gebruiker, niet bij
   de wedstrijd. De kaarttaal hoort wél bij de wedstrijd (i18n-spec §2).
   ========================================================================== */
const STORE = 'scorecard:';

function collectState(){
  return { version: 1, saved: Date.now(), settings: settings(), options: options(),
           mapping: S.mapping, catOrder: S.catOrder, gridMax: S.gridMax };
}

/* Onbekende sleutels worden genegeerd en ontbrekende blijven staan, zodat een
   latere instelling (§12) geen migratie nodig heeft. */
function applyState(st){
  if (!st || typeof st !== 'object') return false;
  const s = st.settings || {}, o = st.options || {};
  if (s.title !== undefined)    $('f-title').value = s.title;
  if (s.subtitle !== undefined) $('f-sub').value = s.subtitle;
  if (s.maxAttempts)            $('f-att').value = s.maxAttempts;
  if (s.format && FORMATS[s.format]) $('f-format').value = s.format;
  if (s.cardLanguage !== undefined){
    cardLangSetting = LANGS.includes(s.cardLanguage) ? s.cardLanguage : '';
    $('f-cardlang').value = cardLangSetting;
  }
  if (o.paper)                  $('o-paper').value = o.paper;
  if (o.showQr !== undefined)   $('o-qr').checked = !!o.showQr;
  if (o.controlSheet !== undefined) $('o-ctl').checked = !!o.controlSheet;
  if (o.colour !== undefined)   $('o-colour').checked = !!o.colour;
  if (st.gridMax)               S.gridMax = st.gridMax, $('f-gridmax').value = st.gridMax;
  if (st.mapping && typeof st.mapping === 'object'){
    S.mapping = {};
    for (const c in st.mapping) if (Array.isArray(st.mapping[c])) S.mapping[c] = st.mapping[c].map(Number);
  }
  if (Array.isArray(st.catOrder)) S.catOrder = st.catOrder;
  return true;
}

let saveTimer = null;
function saveState(){
  const id = $('f-id').value.trim();
  if (!id) return;
  // ponytail: 800ms debounce, anders krijgt elke aanslag in het ID zijn eigen
  // sleutel. Ruim op via "Vergeet deze wedstrijd" als er toch rommel ontstaat.
  clearTimeout(saveTimer);
  saveTimer = setTimeout(() => {
    try { localStorage.setItem(STORE + id, JSON.stringify(collectState())); }
    catch (e){ /* volle of geblokkeerde opslag mag het afdrukken niet breken */ }
    renderSaved();
  }, 800);
}

function listSaved(){
  const out = [];
  for (let i = 0; i < localStorage.length; i++){
    const k = localStorage.key(i);
    if (!k.startsWith(STORE)) continue;
    try { out.push({ id: k.slice(STORE.length), saved: JSON.parse(localStorage.getItem(k)).saved || 0 }); }
    catch (e){ /* onleesbare sleutel overslaan */ }
  }
  return out.sort((a, b) => b.saved - a.saved);
}

function loadSaved(id){
  try {
    const st = JSON.parse(localStorage.getItem(STORE + id));
    if (!applyState(st)) return false;
    $('f-id').value = id;
    return true;
  } catch (e){ return false; }
}

function exportMapping(){
  const st = collectState();
  const blob = new Blob([JSON.stringify(st, null, 2)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = st.settings.competitionId + '-boulders.json';
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}

/* Accepteert zowel een volledig geëxporteerd bestand als een kale
   { categorie: [nummers] } — dezelfde soepelheid als het JSON-tabblad. */
function importMapping(text){
  const data = JSON.parse(text);
  if (data && data.mapping) return applyState(data);
  return applyState({ mapping: data });
}

/* ==========================================================================
   Taalkeuze (i18n-spec §10) — wisselen tekent alles opnieuw en raakt de
   geladen deelnemers en de boulderindeling niet aan.
   ========================================================================== */
function applyStatic(){
  document.documentElement.lang = uiLang === PSEUDO ? FALLBACK : uiLang;
  document.querySelectorAll('[data-i18n]').forEach(el => el.innerHTML = mk(t(el.dataset.i18n)));
  document.querySelectorAll('[data-i18n-ph]').forEach(el => el.placeholder = t(el.dataset.i18nPh));
  document.querySelectorAll('[data-i18n-aria]').forEach(el =>
    el.setAttribute('aria-label', t(el.dataset.i18nAria)));
  // De lege-voorbeeldtekst zit in CSS content en kan daar niet vertaald worden.
  $('print').style.setProperty('--empty-msg', JSON.stringify(t('ui.print.empty')));
}

function setUiLang(lang){
  uiLang = lang;
  if (lang !== PSEUDO){
    lastRealLang = lang;
    try { localStorage.setItem(UILANG_KEY, lang); } catch (e){ /* privé venster */ }
  }
  applyStatic();
  renderLangSel();
  refresh();
}

function renderLangSel(){
  $('langsel').innerHTML = LANGS.concat(uiLang === PSEUDO ? [PSEUDO] : []).map(l =>
    '<button type="button" class="' + (l === uiLang ? 'on' : '') + '" data-lang="' + l + '">' +
    esc(l.toUpperCase()) + '</button>').join('');
}

/* --- deelnemers --- */
function loadCSVText(text){
  S.loadError = null;
  try {
    S.participants = toParticipants(parseCSV(text));
  } catch (e){
    S.participants = [];
    S.loadError = e;
  }
  // Ontbrekende categorieën aanvullen, maar niets weggooien: een categorie die
  // wel in de indeling zit en niet in de CSV moet een harde fout geven (§5).
  for (const c of categories()) if (!S.mapping[c]) S.mapping[c] = [];
  refresh();
}

function renderParticipants(){
  const st = $('csv-status'), tags = $('csv-cats');
  if (S.loadError){ st.innerHTML = '<div class="msg err">' + esc(emsg(S.loadError)) + '</div>'; tags.innerHTML = ''; return; }
  if (!S.participants.length){ st.innerHTML = ''; tags.innerHTML = ''; return; }
  const cats = categories();
  st.innerHTML = '<div class="msg ok">' + esc(tn('ui.participants.loaded', S.participants.length)) +
    ' ' + esc(tn('ui.participants.categoryCount', cats.length)) + '</div>';
  tags.innerHTML = cats.map(c => '<span class="tag">' + esc(c) + ' &middot; <b>' +
    nf(S.participants.filter(p => p.category === c).length) + '</b></span>').join('');
}

/* --- boulderraster --- */
function renderGrid(){
  const cats = categories(), wrap = $('gridwrap');
  if (!cats.length){
    wrap.innerHTML = '<p class="hint" style="padding:14px">' + et('ui.boulders.gridNeedsCsv') + '</p>';
    return;
  }
  let h = '<table class="grid"><thead><tr><th>' + et('ui.boulders.gridBoulder') + '</th>' +
    cats.map((c, i) => '<th data-col="' + i + '">' + esc(c) + '</th>').join('') + '</tr></thead><tbody>';
  for (let b = 1; b <= S.gridMax; b++){
    h += '<tr><td class="b" data-row="' + b + '">' + b + '</td>' +
      cats.map(c => '<td class="c' + (S.mapping[c].includes(b) ? ' on' : '') +
        '" data-cat="' + esc(c) + '" data-b="' + b + '"></td>').join('') + '</tr>';
  }
  h += '</tbody><tfoot><tr><td>' + et('ui.boulders.gridCount') + '</td>' +
       cats.map(c => '<td>' + S.mapping[c].length + '</td>').join('') + '</tr></tfoot></table>';
  wrap.innerHTML = h;
}

function setCell(cat, b, on){
  const arr = S.mapping[cat], i = arr.indexOf(b);
  if (on && i < 0) arr.push(b);
  if (!on && i >= 0) arr.splice(i, 1);
}

/* --- rapport --- */
function renderReport(v){
  const box = $('report');
  if (!S.participants.length || !Object.keys(S.mapping).length){
    box.innerHTML = '<p class="hint">' + et('ui.validation.empty') + '</p>';
    return;
  }
  let h = '';
  if (!v.errors.length && !v.warnings.length) h = '<div class="msg ok">' + et('ui.validation.allClear') + '</div>';
  if (v.errors.length){
    h += '<div class="msg err">' + esc(tn('ui.validation.errorCount', v.errors.length)) + '</div>';
    h += '<ul class="report">' + v.errors.map(e => '<li class="e">' + et(e.key, e.params) + '</li>').join('') + '</ul>';
  }
  if (v.warnings.length){
    h += '<ul class="report" style="margin-top:10px">' +
      v.warnings.map(w => '<li class="w">' + et(w.key, w.params) + '</li>').join('') + '</ul>';
    h += '<label class="ackbox"><input type="checkbox" id="ack"' + (S.ack ? ' checked' : '') + '>' +
         '<span>' + esc(tn('ui.validation.ack', v.warnings.length)) + '</span></label>';
  }
  box.innerHTML = h;
  const a = $('ack');

/* Eén pad voor beide plakmethodes: parse, toon de uitkomst, vul de indeling. */
function applyPaste(parse){
  S.pasteMsg = null; S.jsonKeys = null;
  if (!categories().length){
    S.pasteMsg = { type: 'err', parts: [{ key: 'ui.paste.needCsv' }] };
    return refresh();
  }
  try {
    const res = parse();
    if (res.needsMapping){
      S.jsonKeys = res.keys;
      S.pasteMsg = { type: 'err', parts: [{ key: 'ui.paste.unknownJson', params: { rows: res.rows } }] };
    } else {
      S.mapping = res.mapping;
      S.catOrder = res.order.length ? res.order : null;
      S.pasteMsg = { type: 'ok', parts: [res.info, { key: 'ui.paste.filled', count: res.order.length }] };
    }
  } catch (e){
    // Een parserfout draagt een sleutel; een kapotte JSON.parse levert alleen de
    // boodschap van de browser en die gaat er ongewijzigd door.
    S.pasteMsg = { type: 'err', parts: [ e.i18n ? { key: e.i18n.key, params: e.i18n.params }
                                                : { raw: emsg(e) } ] };
  }
  refresh();
}

/* ==========================================================================
   Diagnose vertalingen (i18n-spec §6.2) — dezelfde controles als
   check_locales.py, maar zichtbaar in de app zelf.
   ========================================================================== */
/* Een {plaatshouder} telt als twee tekens: het langste getal dat er in de
   praktijk in komt te staan ("POGING 12"). */
const budgetLength = s => String(s).replace(/\{\w+\}/g, '::').length;
const placeholders = s => [...new Set(String(s).match(/\{\w+\}/g) || [])].sort().join(' ');

function localeProblems(){
  const out = [];
  const base = Object.keys(LOCALES[FALLBACK]);
  const baseSet = new Set(base);
  const pluralBases = base.filter(k => k.endsWith('.one')).map(k => k.slice(0, -4));

  for (const lang of LANGS){
    const d = LOCALES[lang];
    const missing = base.filter(k => typeof d[k] !== 'string' || !d[k]);
    const extra   = Object.keys(d).filter(k => !baseSet.has(k));
    if (missing.length) out.push({ key:'ui.diag.missingKeys',
      params:{ lang, count: missing.length, keys: missing.join(', ') } });
    if (extra.length)   out.push({ key:'ui.diag.extraKeys',
      params:{ lang, count: extra.length, keys: extra.join(', ') } });

    for (const k of base){
      if (typeof d[k] !== 'string') continue;
      const want = placeholders(LOCALES[FALLBACK][k]), got = placeholders(d[k]);
      if (want !== got) out.push({ key:'ui.diag.placeholderMismatch',
        params:{ key:k, lang, found: got || '—', expected: want || '—' } });
    }
    for (const pb of pluralBases) for (const form of ['one','other'])
      if (typeof d[pb + '.' + form] !== 'string')
        out.push({ key:'ui.diag.missingPlural', params:{ key: pb, lang, form } });

    for (const k in BUDGETS){
      if (typeof d[k] !== 'string') continue;
      const len = budgetLength(d[k]);
      if (len > BUDGETS[k]) out.push({ key:'ui.diag.budgetExceeded',
        params:{ key:k, lang, length: len, budget: BUDGETS[k], value: d[k] } });
    }
  }
  return out;
}

function renderDiag(){
  const probs = localeProblems();
  // §6.2: een banner, geen console.warn — die ziet de organisator nooit.
  $('diag-banner').innerHTML = probs.length ? '<div class="msg err">' + et('ui.diag.banner') + '</div>' : '';

  const base = Object.keys(LOCALES[FALLBACK]);
  const pct = new Intl.NumberFormat(fmtLocale(), { style:'percent', maximumFractionDigits:1 });
  const cov = LANGS.map(lang => {
    const d = LOCALES[lang];
    const done = base.filter(k => typeof d[k] === 'string' && d[k]).length;
    return '<li>' + et('ui.diag.coverage', { lang, done: nf(done), total: nf(base.length),
      percent: pct.format(done / base.length) }) + '</li>';
  }).join('');

  $('diag-body').innerHTML = '<ul class="report">' + cov + '</ul>' +
    (probs.length
      ? '<ul class="report">' + probs.map(p => '<li class="e">' + et(p.key, p.params) + '</li>').join('') + '</ul>'
      : '<div class="msg ok">' + et('ui.diag.ok') + '</div>') +
    '<label class="ackbox"><input type="checkbox" id="diag-pseudo"' + (uiLang === PSEUDO ? ' checked' : '') +
      '><span>' + et('ui.diag.pseudo') + '</span></label>';
  $('diag-pseudo').onchange = e => setUiLang(e.target.checked ? PSEUDO : lastRealLang);
}

/* --- alles opnieuw opbouwen --- */
function refresh(){
  renderParticipants();
  renderGrid();
  renderTabs();
  renderSaved();
  renderDiag();

  const cats = orderedCategories();
  const set = settings();
  // Het formaat bepaalt hoeveel boulders er op een kaart passen, dus de controle
  // moet het kennen (timed-spec §5).
  const opts = Object.assign(options(), { format: set.format });
  // Een tijdslotformaat kent geen vast aantal pogingen; het veld hoort dan uit.
  $('f-att').disabled = !fmtDef(set.format).usesAttempts;
  const v = (S.participants.length && cats.length)
    ? validate(S.participants, S.mapping, cats, opts)
    : { errors: [], warnings: [] };
  renderReport(v);
  applyPaper(opts.paper);
  saveState();

  document.title = t('ui.print.documentTitle', { title: set.title });

  const blocked = !!v.errors.length || !S.participants.length || !cats.length ||
                  (v.warnings.length > 0 && !S.ack);
  $('btn-print').disabled = blocked;

  const out = $('print');
  if (blocked){ out.innerHTML = ''; $('print-stat').textContent = ''; return; }

  const t0 = performance.now();
  const ctx = Object.assign(set, opts, { mapping: S.mapping, catOrder: cats, cardLang: cardLang() });
  out.innerHTML = buildSheets(S.participants, ctx);
  const sheets = out.querySelectorAll('.sheet.cards').length;
  $('print-stat').textContent = tn('ui.print.stat', S.participants.length, {
    cards: nf(S.participants.length), sheets: nf(sheets), paper: opts.paper,
    ms: nf(Math.round(performance.now() - t0)) });
}

  // een bestaand wedstrijd-ID haalt zijn eigen instellingen en indeling terug
  $('f-id').addEventListener('input', () => {
    const id = $('f-id').value.trim();

  });

  $('f-csv').addEventListener('change', e => {
    const f = e.target.files[0];
    if (f) f.text().then(loadCSVText);
  });

  document.querySelectorAll('.tab').forEach(b =>
    b.addEventListener('click', () => { S.tab = b.dataset.tab; S.pasteMsg = null; refresh(); }));
  $('btn-table').addEventListener('click', () => applyPaste(() =>
    parseBoulderTable($('f-table').value, categories())));
  $('btn-json').addEventListener('click', () => applyPaste(() =>
    parseBoulderJSON($('f-json').value, categories())));

  $('btn-export').addEventListener('click', exportMapping);
  $('f-import').addEventListener('change', e => {
    const f = e.target.files[0];
    if (!f) return;
    f.text().then(txt => {
      try {
        importMapping(txt);
        S.pasteMsg = { type: 'ok', parts: [{ key: 'ui.import.ok', params: { file: f.name } }] };
      } catch (err){
        S.pasteMsg = { type: 'err', parts: [{ key: 'ui.import.fail',
          params: { file: f.name, message: emsg(err) } }] };
      }
      refresh();
    });
    e.target.value = '';
  });
  $('f-gridmax').addEventListener('input', e => {
    S.gridMax = Math.max(1, Math.min(200, Number(e.target.value) || 30));
    refresh();
  });
  $('btn-clear').addEventListener('click', () => {
    S.mapping = {};
    categories().forEach(c => S.mapping[c] = []);   // ook restanten uit een geplakte indeling
    S.catOrder = null;
    refresh();
  });

  // klikken en slepen in het raster
  let paint = null;
  $('gridwrap').addEventListener('mousedown', e => {
    const td = e.target.closest('td.c, td.b, th[data-col]');
    if (!td) return;
    e.preventDefault();
    const cats = categories();
    if (td.dataset.row !== undefined){            // hele rij
      const b = Number(td.dataset.row);
      const on = !cats.every(c => S.mapping[c].includes(b));
      cats.forEach(c => setCell(c, b, on));
    } else if (td.dataset.col !== undefined){     // hele kolom
      const c = cats[Number(td.dataset.col)];
      const on = S.mapping[c].length < S.gridMax;
      S.mapping[c] = on ? Array.from({length: S.gridMax}, (_, i) => i + 1) : [];
    } else {
      paint = !td.classList.contains('on');
      setCell(td.dataset.cat, Number(td.dataset.b), paint);
    }
    refresh();
  });
  $('gridwrap').addEventListener('mouseover', e => {
    if (paint === null) return;
    const td = e.target.closest('td.c');
    if (!td || td.classList.contains('on') === paint) return;
    setCell(td.dataset.cat, Number(td.dataset.b), paint);
    td.classList.toggle('on', paint);
  });
  document.addEventListener('mouseup', () => { if (paint !== null){ paint = null; refresh(); } });

  $('btn-print').addEventListener('click', () => window.print());
}

/* ==========================================================================
   Zelftest — open dit bestand met ?selftest
   Meldingen worden op sleutel gecontroleerd, niet op Nederlandse tekst: anders
   breekt elke vertaalronde de test.
   ========================================================================== */
function selfTest(){
  const out = [];
  const ok = (name, cond, extra) => out.push({ name, pass: !!cond, extra: cond ? '' : (extra || '') });
  const eq = (name, a, b) => ok(name, JSON.stringify(a) === JSON.stringify(b), 'kreeg ' + JSON.stringify(a) + ', verwacht ' + JSON.stringify(b));

  // --- CSV ---
  const csv = '﻿Category;Starting number;Ranking;Name\r\n' +
              'u15 (meisjes);6;2;"Peeters; Amélie"\r\n' +
              'u19 (jongens);69;5;"D\'\'Hondt ""Théo"""\r\n' +
              'u11 (meisjes/jongens);80;8;"Van der\nStraeten Noah"\r\n';
  const rows = parseCSV(csv);
  eq('CSV: 4 records (BOM weg, CRLF, newline in veld)', rows.length, 4);
  eq('CSV: puntkomma in aanhalingstekens blijft één veld', rows[1][3], 'Peeters; Amélie');
  eq('CSV: dubbele aanhalingstekens worden er één', rows[2][3], 'D\'\'Hondt "Théo"');
  eq('CSV: newline binnen een veld blijft behouden', rows[3][3], 'Van der\nStraeten Noah');
  eq('CSV: accenten intact', rows[1][3].includes('é'), true);
  eq('CSV: scheidingsteken geraden (tab)', sniffDelimiter('a\tb\tc'), '\t');
  eq('CSV: kolommen op naam, Ranking genegeerd', toParticipants(rows)[0].number, 6);
  eq('CSV: rijnummer telt de kopregel mee', toParticipants(rows)[0].rowNo, 2);

  // --- basis voor validatie ---
  const P = (n, cat, name) => ({ rowNo: n + 1, category: cat, numberRaw: String(n), number: n,
                                 name: name === undefined ? 'Naam ' + n : name });
  const base = [P(1, 'A'), P(2, 'A'), P(3, 'B')];
  const map  = { A: [1,2,3,4], B: [1,2,3,4] };
  const cats = ['A', 'B'];
  eq('Validatie: schone invoer geeft niets', validate(base, map, cats), { errors: [], warnings: [] });

  const has  = (v, key, check) => v.errors.some(e => e.key === key && (!check || check(e.params)));
  const wHas = (v, key, check) => v.warnings.some(w => w.key === key && (!check || check(w.params)));
  ok('Fout: categorie zonder boulderindeling noemt de categorie',
     has(validate(base, { A: [1,2] }, ['A']), 'validation.error.categoryMissingInMapping', p => p.category === 'B'));
  ok('Fout: categorie zonder deelnemers noemt de categorie',
     has(validate([P(1,'A')], { A:[1], B:[1] }, ['A','B']), 'validation.error.categoryWithoutParticipants', p => p.category === 'B'));
  ok('Fout: dubbele boulder noemt categorie en nummer',
     has(validate(base, { A:[1,1,2], B:[1] }, cats), 'validation.error.duplicateBoulder',
         p => p.number === 1 && p.category === 'A'));
  ok('Fout: nul boulders', has(validate(base, { A:[], B:[1] }, cats), 'validation.error.categoryZeroBoulders'));
  ok('Fout: dubbel startnummer noemt beide rijen',
     has(validate([P(1,'A'), {rowNo:3, category:'A', numberRaw:'1', number:1, name:'Bis'}], {A:[1]}, ['A']),
         'validation.error.duplicateStartNumber', p => p.rowA === 2 && p.rowB === 3));
  ok('Fout: lege naam noemt de rij',
     has(validate([P(1,'A','')], { A:[1] }, ['A']), 'validation.error.nameEmpty', p => p.row === 2));
  ok('Fout: startnummer 0 is niet positief',
     has(validate([{rowNo:2,category:'A',numberRaw:'0',number:0,name:'X'}], {A:[1]}, ['A']), 'validation.error.numberNotPositive'));
  ok('Fout: startnummer met letters',
     has(validate([{rowNo:2,category:'A',numberRaw:'12a',number:NaN,name:'X'}], {A:[1]}, ['A']),
         'validation.error.numberNotPositive', p => p.value === '12a'));
  ok('C6: fouten blokkeren, ze stoppen niet bij de eerste',
     validate([P(1,'A',''), {rowNo:3,category:'',numberRaw:'',number:NaN,name:''}], {}, []).errors.length >= 4);

  // --- waarschuwingen ---
  ok('Waarschuwing: ongelijke boulderaantallen',
     wHas(validate(base, { A:[1,2,3], B:[1,2] }, cats), 'validation.warning.differingBoulderCounts'));
  ok('Waarschuwing: meer boulders dan er passen',
     wHas(validate(base, { A: Array.from({length: L.maxRows + 1}, (_, i) => i + 1), B:[1] }, cats), 'validation.warning.tooManyBoulders'));
  ok('Geen waarschuwing bij precies het maximum',
     !wHas(validate(base, { A: Array.from({length: L.maxRows}, (_, i) => i + 1),
                            B: Array.from({length: L.maxRows}, (_, i) => i + 1) }, cats), 'validation.warning.tooManyBoulders'));
  ok('Waarschuwing: te lange naam',
     wHas(validate([P(1,'A','Vandenbroucke-Van Nieuwenhuyse Alexander Maximiliaan Jean-Baptiste de la Court')],
                   { A:[1] }, ['A']), 'validation.warning.nameTooLong'));

  // --- layout ---
  eq('Layout: kaarthoogte klopt met de rijruimte', L.body, 82.5);
  eq('Layout: 10 boulders passen bij 8mm', L.maxRows >= 10, true);
  ok('Layout: 4 boulders vullen tot de maximale rijhoogte', L.body / 4 > L.maxRow);

  // --- sortering ---
  const mixed = [P(9,'B'), P(2,'A'), P(1,'B'), P(5,'A')];
  eq('Sortering: categorie uit de indeling, dan startnummer',
     sortCards(mixed, ['B','A']).map(p => p.category + p.number), ['B1','B9','A2','A5']);

  // --- QR ---
  eq('QR: payload', qrPayload('abyc2026-m4', 69), 'abyc2026-m4:69');
  eq('QR: payload met athleteId (toekomst)', qrPayload('abyc2026-m4', 69, 'A123'), 'abyc2026-m4:69:A123');
  ok('QR: svg gegenereerd', qrSvg('abyc2026-m4:69').startsWith('<svg'));

  // --- opbouw kaarten ---
  const ctx = { title:'T', subtitle:'', competitionId:'x', maxAttempts:5, paper:'A4', showQr:true,
                mapping: map, catOrder: cats, controlSheet:false, colour:false, cardLang:'nl' };
  const html = buildSheets(base, ctx);
  const d = document.createElement('div'); d.innerHTML = html;
  eq('Opbouw: 3 kaarten op 2 bladen', d.querySelectorAll('.card').length + '/' + d.querySelectorAll('.sheet').length, '3/2');
  eq('Opbouw: 13 kolommen bij 5 pogingen', d.querySelector('.score tbody tr').children.length, 13);
  eq('Opbouw: boulternummer voorgedrukt', d.querySelector('.score tbody td.bnum').textContent, '1');
  ok('Opbouw: laatste blad heeft één kaart, geen halve',
     d.querySelectorAll('.sheet')[1].querySelectorAll('.card').length === 1);

  // --- scoretabel: de enige plek die kolommen kent (§12.2) ---
  const throws = (name, fn, re) => {
    let msg = null;
    try { fn(); } catch (e) { msg = e.message; }
    ok(name, msg !== null && (!re || re.test(msg)), 'kreeg ' + JSON.stringify(msg));
  };
  const st = o => { const d = document.createElement('div');
    d.innerHTML = renderScoreTable(Object.assign({ capture:'fixed-columns', lang:'nl' }, o)); return d; };
  const numRows = n => Array.from({ length: n }, (_, i) => ({ id: i + 1, label: String(i + 1) }));

  const abyc = st({ rows: numRows(10), attemptColumns: 5 });
  eq('Tabel: 5 pogingen + 1 zone geeft 13 kolommen',
     abyc.querySelector('tbody tr').children.length, 13);
  eq('Tabel: 12 invulvakjes per rij', abyc.querySelectorAll('tbody tr td:not(.bnum)').length / 10, 12);
  eq('Tabel: voettekst overspant 11 kolommen met 2 totaalvakjes',
     abyc.querySelector('tfoot td.lab').colSpan + '/' + (abyc.querySelectorAll('tfoot td').length - 1), '11/2');
  eq('Tabel: 4 pogingen geeft 11 kolommen',
     st({ rows: numRows(4), attemptColumns: 4 }).querySelector('tbody tr').children.length, 11);
  eq('Tabel: zonder zone alleen T per poging',
     st({ rows: numRows(4), attemptColumns: 5, zones: 0 }).querySelector('tbody tr').children.length, 7);
  eq('Tabel: twee zones geven Z1/Z2/T per poging',
     st({ rows: numRows(4), attemptColumns: 5, zones: 2 }).querySelector('tbody tr').children.length, 19);
  eq('Tabel: standaardwaarden geven de ABYC-kaart',
     st({ rows: numRows(10), attemptColumns: 5 }).innerHTML,
     st({ rows: numRows(10), attemptColumns: 5, zones: 1, rowScoreColumn: true, totalsRow: true }).innerHTML);

  // --- RCYC: één vakje per poging, eigen scorekolommen, twee telregels ---
  const rcyc = st(seamOptions('rcyc', [1,2,3,4,5,6,7,8,9], 'nl', 5));

     rcyc.querySelector('tbody tr').children.length, 8);
  eq('RCYC: koppen ROUTES, POGING 1..5, SCORE TOP, SCORE ZONE',
     Array.from(rcyc.querySelectorAll('thead th')).map(th => th.textContent).join('|'),
     'ROUTES|POGING 1|POGING 2|POGING 3|POGING 4|POGING 5|SCORE TOP|SCORE ZONE');
  eq('RCYC: scorekolommen dragen de sjabloonklassen (grijs, dikke lijn)',
     Array.from(rcyc.querySelectorAll('tbody tr:first-child td')).map(td => td.className).join('|'),
     'bnum|||||' + '|sc sc0|sc');
  eq('RCYC: twee voetregels', rcyc.querySelectorAll('tfoot tr').length, 2);
  eq('RCYC: voetregels heten SCORE en POGINGEN',
     Array.from(rcyc.querySelectorAll('tfoot td.lab')).map(td => td.textContent).join('/'),
     'SCORE/POGINGEN');
  eq('RCYC: voetregel = grijze band over 5 kolommen, labelvak, 2 grijze invulvakken',
     Array.from(rcyc.querySelectorAll('tfoot tr:first-child td')).map(td => td.className + ':' + td.colSpan).join('|'),
     'spacer:5|lab:1|sc sc0:1|sc:1');
  // De tabel moet met zijn eigen ruimte rekenen; op de globale ABYC-waarde liep
  // hij door de extra voetregel 9mm onder de kaart uit.
